      - id: CSPEN_PANC_2025_PN_INDICATION
        rule: "肠外营养适应证：胃肠道功能障碍、高分解代谢状态、肿瘤放化疗严重胃肠道反应"

## ============================================================================
## NRS 2002 Reference & Validation
## ============================================================================

nrs2002_reference:
  original_validation:
    citation: "Kondrup J, et al. Clin Nutr, 2003;22(3):321-336"
    method: "Analysis of 128 RCTs, 8,944 hospitalized patients"
    conclusion: "Score ≥3 predicts benefit from nutrition support"
    esp_endorsed: true

  scoring_components:
    impaired_nutritional_status:
      - score: 0
        criteria: "Normal nutritional status"
      - score: 1
        criteria: "Weight loss >5% in 3 months OR food intake 50-75% of normal in preceding week"
        category: mild
      - score: 2
        criteria: "Weight loss >5% in 2 months OR BMI 18.5-20.5 + impaired general condition OR food intake 25-50%"
        category: moderate
      - score: 3
        criteria: "Weight loss >5% in 1 month OR BMI <18.5 + impaired general condition OR food intake 0-25%"
        category: severe

    disease_severity:
      - score: 0
        criteria: "Normal nutritional requirements"
      - score: 1
        criteria: "Hip fracture, chronic disease with acute complications (COPD, cirrhosis, chronic dialysis, diabetes, oncology)"
      - score: 2
        criteria: "Major abdominal surgery, stroke, severe pneumonia, hematologic malignancy"
      - score: 3
        criteria: "Head injury, bone marrow transplant, ICU patients (APACHE >10)"

    age_adjustment:
      - score: 1
        criteria: "Age ≥ 70 years"

  interpretation:
    score_0_2: "Low risk — re-screen weekly; no routine nutrition intervention"
    score_3_4: "Medium risk — nutrition intervention indicated; start within 24-48h"
    score_5_7: "High risk — urgent nutrition intervention; start immediately"

  validation_studies:
    - citation: "Sun et al. (2015)"
      n: 3527
      population: "Abdominal surgery patients"
      finding: "NRS≥3 predicts higher post-op complications, mortality, longer LOS"

    - citation: "Gong J et al. Frontiers in Nutrition, 2023"
      n: 270
      population: "Elderly orthopedic + neurosurgical patients"
      finding: "NRS2002 detects 8.4-14.6% malnutrition risk; may underestimate in elderly vs MNA-SF"
      limitation: "Lower sensitivity in elderly"

    - citation: "Cheung HHT et al. Int J Surgery, 2023"
      n: 5695
      type: "Systematic review & network meta-analysis"
      finding: "MUST has highest diagnostic accuracy (sensitivity 86%, specificity 89%) for adult surgical patients"

  limitation_note: "NRS2002 may underestimate risk in elderly patients (>70). Consider supplemental MNA-SF or GNRI in geriatric populations."

## ============================================================================
## Refeeding Syndrome Risk Criteria (ESPEN 2025 Rec.31 + NICE CG32)
## ============================================================================

refeeding_syndrome:
  major_risk_criteria:
    - "BMI < 16 kg/m²"
    - "Unintentional weight loss >15% in 3-6 months"
    - "Little or no nutritional intake >10 days"
    - "Low serum potassium, phosphate, or magnesium before feeding"

  minor_risk_criteria:
    - "BMI < 18.5 kg/m²"
    - "Unintentional weight loss 10-15% in 3-6 months"
    - "Little or no nutritional intake >5 days"
    - "History of alcohol abuse or drugs (insulin, chemotherapy, antacids, diuretics)"

  management:
    - "Start EN at 10-15 kcal/kg/day (max 50% of target)"
    - "Increase slowly over 4-7 days to reach target"
    - "Monitor K+, PO4, Mg2+ daily for first 3 days, then every other day"
    - "Supplement thiamine 200-300mg IV before feeding starts"
    - "Supplement electrolytes to maintain normal serum levels"

## ============================================================================
## GLIM Diagnostic Criteria for Malnutrition (ESPEN 2019, endorsed by CSPEN 2025)
## ============================================================================

glim_criteria:
  phenotypic:
    - "Involuntary weight loss >5% in 6 months"
    - "Low BMI: <18.5 (age <70), <20 (age >70) — Asian criteria may differ"
    - "Reduced muscle mass (via DXA, BIA, CT, or calf circumference)"

  etiologic:
    - "Reduced food intake or assimilation (<50% requirements for >1 week)"
    - "Disease burden / inflammatory condition (acute injury, chronic disease)"

  diagnosis: "At least 1 phenotypic + 1 etiologic criterion required"
  severity_stage_1: "Moderate: weight loss 5-10% in 6 months, BMI <20 (<22 age>70)"
  severity_stage_2: "Severe: weight loss >10% in 6 months, BMI <18.5 (<20 age>70)"

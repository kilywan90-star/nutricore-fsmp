# FSMP Clinical Nutrition Knowledge Base — Authoritative Guidelines Reference
# Compiled from: ESPEN 2025, CSPEN 2025, ASPEN 2024, ERAS Society 2025

## ============================================================================
## ESPEN Guideline on Clinical Nutrition in Surgery — Update 2025
## Weimann A, et al. Clinical Nutrition, 2025;53:222-261. 44 recommendations.
## ============================================================================

guidelines:
  espen_surgery_2025:
    title: "ESPEN guideline on clinical nutrition in surgery – Update 2025"
    authors: "Weimann A, Braga M, Carli F, et al."
    journal: "Clinical Nutrition"
    year: 2025
    volume: 53
    pages: "222-261"
    recommendations: 44

    key_rules:
      - id: ESPEN_SURG_2025_REC1
        rule: "Standard operating procedures (SOPs) for quality management of clinical nutrition shall be established"
        grade: GPP
        agreement: 96%

      - id: ESPEN_SURG_2025_REC20
        rule: "Patients with severe malnutrition and/or high metabolic risk shall receive preoperative nutritional therapy, even if it postpones surgery"
        grade: A
        detail: "A period of 10–14 days should be considered"
        sub_grade: B
        agreement: 93%

      - id: ESPEN_SURG_2025_REC4
        rule: "Oral or tube feeding should begin as early as possible (within hours) postoperatively if patient is alert and hemodynamically stable"
        grade: A

      - id: ESPEN_SURG_2025_REC28
        rule: "Enteral nutrition shall be started within 24h if oral intake <50% expected for 7 days, especially after upper GI resection for tumor"
        grade: "A/B"

      - id: ESPEN_SURG_2025_REC30
        rule: "Consider nasojejunal tube or jejunostomy placement intraoperatively for patients with malnutrition and/or high metabolic risk"
        detail: "Specifically for esophagectomy, total gastrectomy, and pancreatoduodenectomy"
        grade: B
        agreement: 89%

      - id: ESPEN_SURG_2025_REC31
        rule: "Prevent refeeding syndrome: start EN at low rate (10–30 mL/h), advance cautiously after electrolyte stabilization; may take up to 5 days to reach target"
        grade: GPP
        agreement: 95%

      - id: ESPEN_SURG_2025_REC5
        rule: "Oral diet should be adjusted according to surgery type and individual tolerance; carefully assess tolerance in patients at high risk for delayed gastric emptying or postoperative ileus"
        grade: GPP
        agreement: 93%

    preoperative_nutrition:
      - Preoperative carbohydrate loading: clear liquid 10 mL/kg (up to 350 mL) up to 2h before anesthesia
      - Avoid long preoperative fasting: clear fluids up to 2h, solids up to 6h
      - Frailty assessment and sarcopenia diagnosis are now formally included
      - Prehabilitation with nutrition optimization is a formal guideline component

    postoperative_nutrition:
      - Early oral feeding within hours of surgery
      - Oral nutritional supplements (ONS) when oral intake inadequate
      - Metabolic control: strict blood glucose management
      - Early mobilization to facilitate protein synthesis and muscle function


  ## ERAS Society Colorectal Surgery Guidelines 2025
  ## Gustafsson UO, et al. Surgery, 2025;184:109397.
  ## ============================================================================

  eras_colorectal_2025:
    title: "Guidelines for perioperative care in elective colorectal surgery: ERAS Society recommendations 2025"
    authors: "Gustafsson UO, Rockall TA, Wexner S, et al."
    journal: "Surgery"
    year: 2025
    volume: 184
    article: 109397

    key_rules:
      - id: ERAS_CR_2025_NUT1
        rule: "Routine nutritional screening is MANDATORY for all patients"

      - id: ERAS_CR_2025_IMM1
        rule: "Immunonutrition is recommended for malnourished patients"
        detail: "New in 2025: targeted to malnourished patients only, not universal"

      - id: ERAS_CR_2025_CHO1
        rule: "Carbohydrate loading evidence strength has been weakened compared to prior guidelines"

      - id: ERAS_CR_2025_POD0
        rule: "Early oral feeding remains a core component, supported by oral nutritional supplements"

      - id: ERAS_CR_2025_MOB
        rule: "Mobilization ≥3 hours/day from POD1 to discharge"

      - id: ERAS_CR_2025_FLUID
        rule: "Maintain slightly positive fluid balance (≤2.5 kg weight gain)"


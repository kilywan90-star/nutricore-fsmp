version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ddd
      POSTGRES_PASSWORD: ddd_secret_dev
      POSTGRES_DB: digital_doctor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://ddd:ddd_secret_dev@db:5432/digital_doctor
      REDIS_URL: redis://redis:6379/0
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      SECRET_KEY: dev-secret-change-in-production
      PHI_ENCRYPTION_KEY: ${PHI_ENCRYPTION_KEY:-}
      BACKUP_RETENTION_DAYS: "30"
      BACKUP_STORAGE_TYPE: ${BACKUP_STORAGE_TYPE:-local}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
      - backups:/app/backups

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    profiles:
      - s3

volumes:
  pgdata:
  backups:
  minio_data:

name: "物业服务类标书模板"
industry: "物业服务"
bid_type: "物业管理"
version: 1
scoring_emphasis: |
  1. 技术分（50-70%）：服务方案的全面性、专业度、创新性，人员的专业素质
  2. 价格分（20-30%）：报价合理性和性价比
  3. 商务分（10-20%）：企业资质、类似项目数量、客户评价
industry_notes: |
  1. 物业服务标书关键在"人"和"制度"——人员配置标准、管理制度体系必须详细
  2. 各岗位职责、排班、培训计划都要有具体方案
  3. 应急处理预案（消防、疫情、自然灾害等）是加分项
  4. 节能环保措施、智慧物业方案是当前趋势
  5. 服务标准要量化（如"保洁每日巡检X次""报修响应时间X分钟"）
structure: |
  1. 投标函
  2. 开标一览表
  3. 物业管理服务费用报价明细
  4. 整体服务方案（含服务理念、服务目标、服务标准）
  5. 各专项服务方案（安保、保洁、绿化、维修、客服等）
  6. 人员配置方案（含组织架构、岗位职责、人员资质要求）
  7. 管理制度体系（含质量管理、安全管理、档案管理等）
  8. 应急预案（消防、治安、自然灾害、公共卫生、设备故障）
  9. 节能环保及智慧物业方案
  10. 类似项目业绩及客户评价
  11. 服务承诺及考核标准
  12. 商务条款响应/偏离表
  13. 资格审查文件
prompt: |
  请根据以下信息，生成一份专业的物业服务类投标文件。

  ## 项目信息
  - 行业分类：{{ industry }}
  - 标书类型：{{ bid_type }}
  - 截止日期：{{ deadline }}
  - 预算金额：{{ budget }}

  ## 招标文件/招标公告
  {{ bidding_announcement }}

  ## 项目需求
  {{ project_requirements }}

  ## 投标方信息
  - 公司名称：{{ company_name }}
  - 资质与业绩：{{ company_info }}

  ## 重点突出方向
  {{ key_points }}

  ## 补充要求
  {{ additional_requirements }}

  ## 标书结构
  {{ structure }}

  ## 评分侧重点
  {{ scoring_emphasis }}

  ## 行业注意事项
  {{ industry_notes }}

  请生成完整标书，Markdown格式，章节间用 `---` 分隔。
  服务方案务必详细、可量化，不能泛泛而谈。
  各岗位人员配置要具体到人数和职责。
  评分要点用 **【评分要点】** 标注。

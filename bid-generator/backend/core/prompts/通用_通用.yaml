name: "通用默认标书模板"
industry: "通用"
bid_type: "通用"
version: 1
scoring_emphasis: |
  1. 技术方案的针对性、完整性和可行性
  2. 报价的合理性和竞争力
  3. 公司资质和类似项目业绩
  4. 售后服务和技术支持能力
industry_notes: |
  1. 严格响应招标文件的所有实质性要求
  2. 商务条款逐条响应，不得遗漏
  3. 技术方案要具体、可执行
  4. 格式排版要规范、美观
structure: |
  1. 投标函及投标函附录
  2. 法定代表人身份证明及授权委托书
  3. 投标保证金
  4. 报价一览表及分项报价明细
  5. 技术方案/服务方案/施工组织设计
  6. 项目管理机构配置
  7. 资格审查资料
  8. 类似项目业绩证明
  9. 商务条款响应/偏离表
  10. 技术条款响应/偏离表
  11. 售后服务承诺
  12. 其他有利于评审的材料
prompt: |
  请根据以下信息，生成一份完整、专业、高中标率的投标文件。

  ## 项目信息
  - 行业分类：{{ industry }}
  - 标书类型：{{ bid_type }}
  - 截止日期：{{ deadline }}
  - 预算金额：{{ budget }}

  ## 招标公告/招标文件内容
  {{ bidding_announcement }}

  ## 项目需求
  {{ project_requirements }}

  ## 投标方信息
  - 公司名称：{{ company_name }}
  - 公司资质与业绩：{{ company_info }}

  ## 重点突出方向
  {{ key_points }}

  ## 补充要求
  {{ additional_requirements }}

  ## 标书结构
  {{ structure }}

  ## 评分侧重点
  {{ scoring_emphasis }}

  ## 行业注意事项
  {{ industry_notes }}

  请严格按照上述结构生成完整的标书内容。每个章节独立成段，用 `---` 分隔。
  对于需要进一步填写的内容，用【待填写：xxx】标注并给出填写建议。
  对于评分关键点，用 **【评分要点】** 标注。

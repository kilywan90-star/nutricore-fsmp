name: "政府采购通用标书模板"
industry: "政府采购"
bid_type: "货物采购"
version: 1
scoring_emphasis: |
  1. 价格分（30-50%）：报价越低得分越高，但不要低于成本价
  2. 技术分（30-40%）：产品参数响应度、技术先进性、实施方案
  3. 商务分（10-20%）：公司资质、类似业绩、售后服务
  4. 综合评分：根据评分标准逐项响应，不遗漏任何加分项
industry_notes: |
  1. 必须完全响应招标文件的技术参数要求，不允许负偏离
  2. 报价不得超过采购预算，否则直接废标
  3. 需提供完整的营业执照、纳税证明、社保缴纳证明
  4. 货物类采购特别注意：品牌型号、产地、质保期必须明确
  5. 必须使用政府采购法规定的标准格式
structure: |
  1. 投标函
  2. 开标一览表
  3. 分项报价表
  4. 货物说明一览表
  5. 技术规格响应/偏离表
  6. 商务条款响应/偏离表
  7. 产品技术方案（含技术参数、性能介绍、产品优势）
  8. 供货及实施方案（含进度计划、安装调试、验收方案）
  9. 售后服务方案（含保修承诺、技术支持、培训计划）
  10. 资格审查文件
  11. 类似项目业绩证明
  12. 其他有利于评分的材料
prompt: |
  请根据以下信息，生成一份专业的政府采购货物类投标文件。

  ## 项目信息
  - 行业分类：{{ industry }}
  - 标书类型：{{ bid_type }}
  - 截止日期：{{ deadline }}
  - 采购预算：{{ budget }}

  ## 招标文件/招标公告
  {{ bidding_announcement }}

  ## 项目需求
  {{ project_requirements }}

  ## 投标方信息
  - 公司名称：{{ company_name }}
  - 资质与业绩：{{ company_info }}

  ## 重点突出方向
  {{ key_points }}

  ## 补充要求
  {{ additional_requirements }}

  ## 标书结构
  {{ structure }}

  ## 评分侧重点
  {{ scoring_emphasis }}

  ## 行业注意事项
  {{ industry_notes }}

  请生成完整标书，Markdown格式，章节间用 `---` 分隔，评分要点用 **【评分要点】** 标注。

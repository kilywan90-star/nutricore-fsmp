name: "IT系统集成类标书模板"
industry: "IT服务"
bid_type: "系统集成"
version: 1
scoring_emphasis: |
  1. 技术分（40-50%）：集成方案的兼容性、扩展性、安全性
  2. 实施方案分（20-30%）：实施计划、风险预案、验收方案
  3. 产品分（10-20%）：所投产品品牌、型号、技术参数
  4. 价格分（10-20%）：报价合理性
  5. 售后分（5-10%）：运维服务、原厂授权、备件供应
industry_notes: |
  1. 系统集成项目需明确各子系统的接口标准和数据交换方案
  2. 硬件设备需提供原厂授权函和售后服务承诺函
  3. 网络拓扑图和系统架构图对评分有帮助（文字描述即可）
  4. 需考虑与现有系统的兼容性和数据迁移方案
  5. 安全方案（网络安全、数据安全、访问控制）是评审重点
structure: |
  1. 投标函
  2. 开标一览表
  3. 设备及服务报价明细
  4. 系统集成技术方案（含需求分析、架构设计、子系统设计）
  5. 实施方案（含进度计划、安装调试、验收方案）
  6. 主要产品技术参数说明
  7. 项目团队配置
  8. 类似项目业绩
  9. 质量保障方案
  10. 售后服务及运维方案（含SLA）
  11. 培训及知识转移方案
  12. 商务/技术偏离表
  13. 资格审查文件（含原厂授权函）
prompt: |
  请根据以下信息，生成一份专业的IT系统集成类投标文件。

  ## 项目信息
  - 行业分类：{{ industry }}
  - 标书类型：{{ bid_type }}
  - 截止日期：{{ deadline }}
  - 预算金额：{{ budget }}

  ## 招标文件/招标公告
  {{ bidding_announcement }}

  ## 项目技术需求
  {{ project_requirements }}

  ## 投标方信息
  - 公司名称：{{ company_name }}
  - 资质与业绩：{{ company_info }}

  ## 重点突出方向
  {{ key_points }}

  ## 补充要求
  {{ additional_requirements }}

  ## 标书结构
  {{ structure }}

  ## 评分侧重点
  {{ scoring_emphasis }}

  ## 行业注意事项
  {{ industry_notes }}

  请生成完整标书，Markdown格式，章节间用 `---` 分隔。
  技术方案需包含架构设计思路和关键技术的详细说明。
  评分要点用 **【评分要点】** 标注。

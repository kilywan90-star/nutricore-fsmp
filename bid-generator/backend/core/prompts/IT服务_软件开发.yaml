name: "IT信息化服务类标书模板"
industry: "IT服务"
bid_type: "软件开发"
version: 1
scoring_emphasis: |
  1. 技术分（40-50%）：技术方案的先进性、架构设计的合理性、技术栈的成熟度
  2. 实施方案分（20-30%）：项目管理方案、实施计划、风险控制
  3. 团队分（10-20%）：核心人员的资质、经验、证书
  4. 价格分（10-20%）：报价合理性
  5. 售后分（5-10%）：运维服务承诺、SLA、响应时间
industry_notes: |
  1. 技术方案必须具体到技术栈选型，不能用"先进技术"一笔带过
  2. 软件架构图、数据流图、部署架构图等加分（文字描述即可）
  3. 项目团队必须列出具体人员及证书（PMP、高级程序员等）
  4. 过往案例要详细说明：项目规模、技术栈、交付时间、客户评价
  5. 信息安全方案（等保要求、数据加密、备份策略）必不可少
  6. 源代码归属和知识产权条款要明确
structure: |
  1. 投标函
  2. 开标一览表
  3. 项目报价明细（软件开发费、实施费、培训费、运维费）
  4. 技术方案（含需求理解、系统架构、功能设计、技术选型）
  5. 实施方案（含项目管理、开发计划、测试方案、部署方案）
  6. 项目团队配置（含组织架构、核心人员简历）
  7. 类似项目业绩及案例详述
  8. 质量保障方案（含软件开发规范、代码审查、测试流程）
  9. 信息安全方案（含数据保护、权限管理、备份恢复）
  10. 售后服务及运维方案（含SLA、响应时间、服务级别）
  11. 培训计划
  12. 商务条款响应/偏离表
  13. 资格审查文件
prompt: |
  请根据以下信息，生成一份专业的IT软件开发服务类投标文件。

  ## 项目信息
  - 行业分类：{{ industry }}
  - 标书类型：{{ bid_type }}
  - 截止日期：{{ deadline }}
  - 预算金额：{{ budget }}

  ## 招标文件/招标公告
  {{ bidding_announcement }}

  ## 项目技术需求
  {{ project_requirements }}

  ## 投标方信息
  - 公司名称：{{ company_name }}
  - 资质与业绩：{{ company_info }}

  ## 重点突出方向
  {{ key_points }}

  ## 补充要求
  {{ additional_requirements }}

  ## 标书结构
  {{ structure }}

  ## 评分侧重点
  {{ scoring_emphasis }}

  ## 行业注意事项
  {{ industry_notes }}

  请生成完整标书，Markdown格式，章节间用 `---` 分隔。
  技术方案部分务必具体，说明技术选型的理由和优势。
  评分要点用 **【评分要点】** 标注，需要用户补充的用【待填写：xxx】标注。

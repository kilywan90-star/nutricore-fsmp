name: "医疗设备采购标书模板"
industry: "医疗设备"
bid_type: "设备采购"
version: 1
scoring_emphasis: |
  1. 技术分（40-50%）：设备技术参数、先进性、临床适用性
  2. 价格分（20-30%）：设备及耗材的综合成本
  3. 售后分（15-20%）：保修期、维修响应、备件供应、培训
  4. 商务分（10-15%）：供应商资质、类似供货业绩
industry_notes: |
  1. 医疗器械注册证、生产许可证、经营许可证必须齐全且有效
  2. 进口设备需提供报关单、原产地证明
  3. 技术参数必须逐条响应，标注"完全响应"或"正偏离"
  4. 需明确耗材/试剂的供应价格和供应保障方案
  5. 设备安装场地要求（水、电、环境等）需提前说明
  6. 临床培训方案和使用支持是重要加分项
structure: |
  1. 投标函
  2. 开标一览表
  3. 分项报价表（设备、配件、耗材、安装、培训）
  4. 技术规格响应/偏离表（逐条对照招标参数）
  5. 产品技术方案（含设备介绍、技术优势、临床应用）
  6. 供货及安装方案（含进度计划、场地要求、安装调试）
  7. 售后服务方案（含保修、维修响应、备件库、定期巡检）
  8. 临床应用培训方案
  9. 项目团队配置
  10. 类似项目供货业绩（附合同或验收单）
  11. 资格审查文件（含医疗器械注册证、经营许可证、厂家授权函）
  12. 其他优势说明
prompt: |
  请根据以下信息，生成一份专业的医疗设备采购投标文件。

  ## 项目信息
  - 行业分类：{{ industry }}
  - 标书类型：{{ bid_type }}
  - 截止日期：{{ deadline }}
  - 预算金额：{{ budget }}

  ## 招标文件/招标公告
  {{ bidding_announcement }}

  ## 采购需求及技术参数
  {{ project_requirements }}

  ## 投标方信息
  - 公司名称：{{ company_name }}
  - 资质与业绩：{{ company_info }}

  ## 重点突出方向
  {{ key_points }}

  ## 补充要求
  {{ additional_requirements }}

  ## 标书结构
  {{ structure }}

  ## 评分侧重点
  {{ scoring_emphasis }}

  ## 行业注意事项
  {{ industry_notes }}

  请生成完整标书，Markdown格式，章节间用 `---` 分隔。
  技术参数必须逐条响应，标注清楚是否满足要求。
  医疗设备行业的专业术语使用要准确。
  评分要点用 **【评分要点】** 标注。

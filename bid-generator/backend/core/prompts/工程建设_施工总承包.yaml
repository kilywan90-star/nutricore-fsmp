name: "工程建设施工类标书模板"
industry: "工程建设"
bid_type: "施工总承包"
version: 1
scoring_emphasis: |
  1. 报价分（30-50%）：工程量清单报价的准确性和合理性
  2. 技术分（30-50%）：施工组织设计的科学性、可行性、针对性
  3. 商务分（10-20%）：企业资质等级、项目经理资格、类似工程业绩
  4. 信用分：企业信用评价、安全生产记录
industry_notes: |
  1. 工程量清单报价必须准确、完整，漏项或计算错误会导致废标
  2. 施工组织设计是得分关键，必须针对本项目实际情况编写
  3. 项目经理和关键岗位人员必须满足资质要求，且无在建项目
  4. 安全生产许可证必须在有效期内
  5. 注意环境保护、文明施工等政策性要求
  6. 工期承诺必须可行，附施工进度网络图或横道图
structure: |
  1. 投标函及投标函附录
  2. 法定代表人身份证明及授权委托书
  3. 投标保证金（保函）
  4. 已标价工程量清单（含报价说明）
  5. 施工组织设计（含施工方案、技术措施、质量安全保证体系）
  6. 施工进度计划及保障措施
  7. 项目管理机构（项目经理、技术负责人、五大员证书）
  8. 拟投入的主要施工设备
  9. 资格审查资料（营业执照、资质证书、安全生产许可证）
  10. 类似项目业绩（中标通知书、合同、竣工验收证明）
  11. 企业信誉及获奖情况
  12. 其他材料（农民工工资保障承诺、不转包分包承诺等）
prompt: |
  请根据以下信息，生成一份专业的工程建设施工类投标文件。

  {{ bidding_announcement }}

  ## 项目信息
  - 行业分类：{{ industry }}
  - 标书类型：{{ bid_type }}
  - 截止日期：{{ deadline }}
  - 预算金额/控制价：{{ budget }}

  ## 项目需求与技术规格
  {{ project_requirements }}

  ## 投标方信息
  - 公司名称：{{ company_name }}
  - 企业资质与业绩：{{ company_info }}

  ## 重点突出方向
  {{ key_points }}

  ## 补充要求
  {{ additional_requirements }}

  ## 标书结构
  {{ structure }}

  ## 评分侧重点
  {{ scoring_emphasis }}

  ## 行业注意事项
  {{ industry_notes }}

  请生成完整标书，Markdown格式，章节间用 `---` 分隔。
  施工组织设计部分务必针对本项目实际情况，不可使用通用模板。
  需要填写的内容用【待填写：xxx】标注，评分要点用 **【评分要点】** 标注。

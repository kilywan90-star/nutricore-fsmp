name: "政府采购服务类标书模板"
industry: "政府采购"
bid_type: "服务采购"
version: 1
scoring_emphasis: |
  1. 价格分（20-40%）：合理的服务报价
  2. 技术分（40-60%）：服务方案的完整性、专业性、创新性，人员配置的专业度
  3. 商务分（10-20%）：公司资质、类似项目业绩、客户评价
  4. 答辩/演示（如有）：现场表现
industry_notes: |
  1. 服务类标书重点在"人"——项目负责人和核心团队的资质、经验、证书至关重要
  2. 服务方案必须详细、可落地、有时间节点
  3. 管理制度（质量、安全、保密等）需有完整的体系说明
  4. 建议附上过往服务案例的客户评价或感谢信
structure: |
  1. 投标函
  2. 开标一览表
  3. 服务费用报价明细
  4. 服务方案（含服务理念、服务内容、服务流程、服务标准）
  5. 项目管理方案（含组织架构、人员配置、管理制度）
  6. 项目负责人及核心团队介绍
  7. 质量保障方案
  8. 应急预案
  9. 类似项目业绩及证明
  10. 商务条款响应/偏离表
  11. 售后服务及培训方案（如适用）
  12. 资格审查文件
prompt: |
  请根据以下信息，生成一份专业的政府采购服务类投标文件。

  ## 项目信息
  - 行业分类：{{ industry }}
  - 标书类型：{{ bid_type }}
  - 截止日期：{{ deadline }}
  - 预算金额：{{ budget }}

  ## 招标文件/招标公告
  {{ bidding_announcement }}

  ## 项目需求
  {{ project_requirements }}

  ## 投标方信息
  - 公司名称：{{ company_name }}
  - 资质与业绩：{{ company_info }}

  ## 重点突出方向
  {{ key_points }}

  ## 补充要求
  {{ additional_requirements }}

  ## 标书结构
  {{ structure }}

  ## 评分侧重点
  {{ scoring_emphasis }}

  ## 行业注意事项
  {{ industry_notes }}

  请生成完整标书，Markdown格式，章节间用 `---` 分隔，评分要点用 **【评分要点】** 标注。
  服务方案部分请写得详细、具体、可执行，不要泛泛而谈。

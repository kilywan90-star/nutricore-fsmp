<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seedance 2.0 长视频自动生成工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/dist/umd/ffmpeg.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        secondary: '#64748b',
                        success: '#10b981',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                        dark: '#1e293b',
                        light: '#f8fafc'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .scrollbar-hide {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
            .scrollbar-hide::-webkit-scrollbar {
                display: none;
            }
            .glass {
                background: rgba(255, 255, 255, 0.7);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
            }
            .tab-active {
                border-bottom: 2px solid #2563eb;
                color: #2563eb;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    <!-- 顶部导航 -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <i class="fa fa-film text-primary text-2xl mr-3"></i>
                    <h1 class="text-xl font-bold text-dark">Seedance 2.0 长视频自动生成工具</h1>
                </div>
                <div class="flex items-center space-x-3">
                    <div class="flex flex-col items-end">
                        <span id="seedanceApiStatus" class="text-sm text-gray-500">Seedance: 未测试</span>
                        <span id="deepseekApiStatus" class="text-sm text-gray-500">DeepSeek: 未测试</span>
                    </div>
                    <button id="testSeedanceBtn" class="px-3 py-1.5 bg-secondary text-white rounded-md text-sm hover:bg-secondary/90 transition">
                        <i class="fa fa-check mr-1"></i>测试Seedance
                    </button>
                    <button id="testDeepseekBtn" class="px-3 py-1.5 bg-secondary text-white rounded-md text-sm hover:bg-secondary/90 transition">
                        <i class="fa fa-check mr-1"></i>测试DeepSeek
                    </button>
                    <button id="saveSettingsBtn" class="px-3 py-1.5 bg-primary text-white rounded-md text-sm hover:bg-primary/90 transition">
                        <i class="fa fa-save mr-1"></i>保存设置
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- 功能标签页 -->
        <div class="bg-white rounded-xl shadow-md mb-8">
            <div class="flex border-b overflow-x-auto scrollbar-hide">
                <button class="tab-btn tab-active px-6 py-3 font-medium whitespace-nowrap" data-tab="generator">视频生成</button>
                <button class="tab-btn px-6 py-3 font-medium text-gray-500 hover:text-gray-700 whitespace-nowrap" data-tab="analyzer">视频拆解</button>
                <button class="tab-btn px-6 py-3 font-medium text-gray-500 hover:text-gray-700 whitespace-nowrap" data-tab="localization">多语言本地化</button>
                <button class="tab-btn px-6 py-3 font-medium text-gray-500 hover:text-gray-700 whitespace-nowrap" data-tab="batch">批量生成</button>
                <button class="tab-btn px-6 py-3 font-medium text-gray-500 hover:text-gray-700 whitespace-nowrap" data-tab="templates">脚本模板</button>
            </div>
        </div>

        <!-- API设置面板 -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8">
            <h2 class="text-lg font-semibold text-dark mb-4 flex items-center">
                <i class="fa fa-key text-primary mr-2"></i>API 设置（已默认填入最新密钥）
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">火山方舟 Seedance 2.0 API Key</label>
                    <input type="password" id="seedanceApiKey" value="ark-70272cfb-cdc5-42f4-bb67-e8e721557010-bf3e6" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary" placeholder="输入你的火山方舟API密钥">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">DeepSeek V4 Pro API Key</label>
                    <input type="password" id="deepseekApiKey" value="sk-707a90a4206b45e9962d606d7a6434f3" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary" placeholder="输入你的DeepSeek API密钥">
                </div>
            </div>
        </div>

        <!-- 视频生成标签页 -->
        <div id="generator-tab" class="tab-content">
            <!-- 全局参数设置 -->
            <div class="bg-white rounded-xl shadow-md p-6 mb-8">
                <h2 class="text-lg font-semibold text-dark mb-4 flex items-center">
                    <i class="fa fa-cog text-primary mr-2"></i>全局参数设置
                </h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">总时长 (秒)</label>
                        <select id="totalDuration" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary">
                            <option value="10">10秒 (1段)</option>
                            <option value="20">20秒 (2段)</option>
                            <option value="30">30秒 (3段)</option>
                            <option value="40">40秒 (4段)</option>
                            <option value="50">50秒 (5段)</option>
                            <option value="60" selected>60秒 (6段)</option>
                        </select>
                        <p class="text-xs text-gray-400 mt-1">Seedance 2.0 单次最长15秒，超过自动分段</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">画幅比例</label>
                        <select id="aspectRatio" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary">
                            <option value="9:16" selected>9:16 竖屏 (TikTok/Reels)</option>
                            <option value="16:9">16:9 横屏 (YouTube)</option>
                            <option value="1:1">1:1 方形 (Instagram)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">分辨率</label>
                        <select id="resolution" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary">
                            <option value="480p">480p (标清)</option>
                            <option value="720p" selected>720p (高清)</option>
                            <option value="1080p">1080p (全高清)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">随机种子 (固定保持一致)</label>
                        <input type="number" id="seed" value="123456" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary" placeholder="输入随机种子值">
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mt-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">视频风格 (将合并到提示词中)</label>
                        <input type="text" id="style" value="cinematic fantasy, high quality, 4K" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary" placeholder="输入视频风格描述">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">服务等级</label>
                        <select id="serviceTier" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary">
                            <option value="default" selected>default (在线推理)</option>
                            <option value="flex">flex (离线推理, 半价)</option>
                        </select>
                    </div>
                </div>
                <div class="mt-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">全局负面提示词 (将合并到文本提示词中)</label>
                    <textarea id="negativePrompt" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary" placeholder="输入全局负面提示词">blurry, low quality, deformed, ugly, disfigured, bad anatomy, extra limbs, missing limbs, floating limbs, disconnected limbs, malformed hands, long neck, mutated hands and fingers, bad hands, missing fingers, fused fingers, watermark, text, signature</textarea>
                </div>
            </div>

            <!-- 自动生成脚本区域 -->
            <div class="bg-white rounded-xl shadow-md p-6 mb-8">
                <h2 class="text-lg font-semibold text-dark mb-4 flex items-center">
                    <i class="fa fa-magic text-primary mr-2"></i>一键生成脚本
                </h2>
                <div class="grid grid-cols-1 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">基本提示词</label>
                        <textarea id="basePrompt" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary" placeholder="描述你想要的视频内容，例如：这是一个龙之战桌游角色宣传视频，展示炎龙骑士从卡牌中觉醒，释放技能，最终胜利的过程"></textarea>
                    </div>
                    <div class="flex justify-end">
                        <button id="generateScriptBtn" class="px-4 py-2 bg-primary text-white rounded-md hover:bg-primary/90 transition flex items-center">
                            <i class="fa fa-wand-magic-sparkles mr-2"></i>生成完整分镜脚本
                        </button>
                    </div>
                </div>
            </div>

            <!-- 分镜内容区域 -->
            <div class="bg-white rounded-xl shadow-md p-6 mb-8">
                <h2 class="text-lg font-semibold text-dark mb-4 flex items-center">
                    <i class="fa fa-list-ol text-primary mr-2"></i>分镜内容
                </h2>
                <div id="segmentsContainer" class="space-y-6">
                </div>
            </div>

            <!-- 生成控制区域 -->
            <div class="bg-white rounded-xl shadow-md p-6 mb-8">
                <h2 class="text-lg font-semibold text-dark mb-4 flex items-center">
                    <i class="fa fa-play text-primary mr-2"></i>生成控制
                </h2>
                <div class="flex flex-wrap gap-4 justify-center">
                    <button id="generateAllBtn" class="px-6 py-3 bg-success text-white rounded-md hover:bg-success/90 transition flex items-center">
                        <i class="fa fa-play mr-2"></i>生成全部视频
                    </button>
                    <button id="generateNextBtn" class="px-6 py-3 bg-primary text-white rounded-md hover:bg-primary/90 transition flex items-center">
                        <i class="fa fa-step-forward mr-2"></i>生成下一个片段
                    </button>
                    <button id="stopBtn" class="px-6 py-3 bg-danger text-white rounded-md hover:bg-danger/90 transition flex items-center" disabled>
                        <i class="fa fa-stop mr-2"></i>停止生成
                    </button>
                    <button id="concatenateBtn" class="px-6 py-3 bg-warning text-white rounded-md hover:bg-warning/90 transition flex items-center">
                        <i class="fa fa-compress mr-2"></i>拼接所有视频
                    </button>
                </div>
                <div class="mt-6">
                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <div id="progressBar" class="bg-primary h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                    <p id="progressText" class="text-sm text-gray-500 mt-2 text-center">准备就绪</p>
                </div>
            </div>

            <!-- 结果展示区域 -->
            <div class="bg-white rounded-xl shadow-md p-6">
                <h2 class="text-lg font-semibold text-dark mb-4 flex items-center">
                    <i class="fa fa-folder-open text-primary mr-2"></i>生成结果
                </h2>
                <div id="resultsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
                </div>
                <div id="finalResultContainer" class="hidden">
                    <h3 class="text-md font-semibold text-dark mb-4 flex items-center">
                        <i class="fa fa-check-circle text-success mr-2"></i>完整拼接视频
                    </h3>
                    <div class="bg-gray-50 rounded-lg overflow-hidden shadow-sm">
                        <div class="aspect-video bg-black">
                            <video id="finalVideo" controls class="w-full h-full object-contain"></video>
                        </div>
                        <div class="p-3 flex justify-between items-center">
                            <h4 class="font-medium text-dark">完整视频</h4>
                            <a id="downloadFinalBtn" href="#" download="final_video.mp4" class="text-primary text-sm hover:underline">下载完整视频</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 视频拆解标签页 -->
        <div id="analyzer-tab" class="tab-content hidden">
            <div class="bg-white rounded-xl shadow-md p-6 mb-8">
                <h2 class="text-lg font-semibold text-dark mb-4 flex items-center">
                    <i class="fa fa-scissors text-primary mr-2"></i>竞品视频一键拆解
                </h2>
                <div class="grid grid-cols-1 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">上传竞品视频</label>
                        <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center">
                            <input type="file" id="videoUpload" accept="video/*" class="hidden">
                            <label for="videoUpload" class="cursor-pointer">
                                <i class="fa fa-upload text-4xl text-gray-400 mb-2"></i>
                                <p class="text-gray-500">点击上传视频文件 (支持MP4, MOV, 最长60秒)</p>
                            </label>
                        </div>
                    </div>
                    <div class="flex justify-end">
                        <button id="analyzeVideoBtn" class="px-4 py-2 bg-primary text-white rounded-md hover:bg-primary/90 transition flex items-center" disabled>
                            <i class="fa fa-search mr-2"></i>开始拆解视频
                        </button>
                    </div>
                </div>
            </div>

            <div id="analysisResultContainer" class="bg-white rounded-xl shadow-md p-6 hidden">
                <h2 class="text-lg font-semibold text-dark mb-4 flex items-center">
                    <i class="fa fa-file-text text-primary mr-2"></i>拆解结果
                </h2>
                <div id="analysisResult" class="space-y-4">
                </div>
                <div class="mt-6 flex justify-end">
                    <button id="applyScriptBtn" class="px-4 py-2 bg-success text-white rounded-md hover:bg-success/90 transition flex items-center">
                        <i class="fa fa-check mr-2"></i>应用到视频生成
                    </button>
                </div>
            </div>
        </div>

        <!-- 多语言本地化标签页 -->
        <div id="localization-tab" class="tab-content hidden">
            <div class="bg-white rounded-xl shadow-md p-6 mb-8">
                <h2 class="text-lg font-semibold text-dark mb-4 flex items-center">
                    <i class="fa fa-globe text-primary mr-2"></i>多语言一键本地化
                </h2>
                <div class="grid grid-cols-1 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">选择源视频</label>
                        <select id="sourceVideo" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary">
                            <option value="">请先生成视频</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">源语言</label>
                        <select id="sourceLanguage" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary">
                            <option value="zh" selected>中文</option>
                            <option value="en">英语</option>
                            <option value="es">西班牙语</option>
                            <option value="pt">葡萄牙语</option>
                            <option value="ja">日语</option>
                            <option value="ko">韩语</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">目标语言 (可多选)</label>
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                            <label class="flex items-center">
                                <input type="checkbox" value="en" class="target-language mr-2" checked> 英语
                            </label>
                            <label class="flex items-center">
                                <input type="checkbox" value="es" class="target-language mr-2" checked> 西班牙语
                            </label>
                            <label class="flex items-center">
                                <input type="checkbox" value="pt" class="target-language mr-2" checked> 葡萄牙语
                            </label>
                            <label class="flex items-center">
                                <input type="checkbox" value="ja" class="target-language mr-2"> 日语
                            </label>
                            <label class="flex items-center">
                                <input type="checkbox" value="ko" class="target-language mr-2"> 韩语
                            </label>
                            <label class="flex items-center">
                                <input type="checkbox" value="fr" class="target-language mr-2"> 法语
                            </label>
                        </div>
                    </div>
                    <div class="flex justify-end">
                        <button id="localizeBtn" class="px-4 py-2 bg-primary text-white rounded-md hover:bg-primary/90 transition flex items-center">
                            <i class="fa fa-language mr-2"></i>生成本地化版本
                        </button>
                    </div>
                </div>
            </div>

            <div id="localizationResultContainer" class="bg-white rounded-xl shadow-md p-6 hidden">
                <h2 class="text-lg font-semibold text-dark mb-4 flex items-center">
                    <i class="fa fa-check-circle text-success mr-2"></i>本地化结果
                </h2>
                <div id="localizationResults" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                </div>
            </div>
        </div>

        <!-- 批量生成标签页 -->
        <div id="batch-tab" class="tab-content hidden">
            <div class="bg-white rounded-xl shadow-md p-6 mb-8">
                <h2 class="text-lg font-semibold text-dark mb-4 flex items-center">
                    <i class="fa fa-list text-primary mr-2"></i>产品库批量生成
                </h2>
                <div class="grid grid-cols-1 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">选择脚本模板</label>
                        <select id="batchTemplate" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary">
                            <option value="">请先创建脚本模板</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">上传产品表 (CSV/Excel)</label>
                        <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center">
                            <input type="file" id="productUpload" accept=".csv,.xlsx,.xls" class="hidden">
                            <label for="productUpload" class="cursor-pointer">
                                <i class="fa fa-table text-4xl text-gray-400 mb-2"></i>
                                <p class="text-gray-500">点击上传产品表<br>格式：产品名称, SKU, 图片链接, 描述</p>
                            </label>
                        </div>
                    </div>
                    <div id="productPreview" class="hidden">
                        <label class="block text-sm font-medium text-gray-700 mb-2">产品预览</label>
                        <div class="overflow-x-auto">
                            <table class="min-w-full divide-y divide-gray-200">
                                <thead class="bg-gray-50">
                                    <tr id="productTableHeader"></tr>
                                </thead>
                                <tbody id="productTableBody" class="bg-white divide-y divide-gray-200"></tbody>
                            </table>
                        </div>
                    </div>
                    <div class="flex justify-end">
                        <button id="batchGenerateBtn" class="px-4 py-2 bg-success text-white rounded-md hover:bg-success/90 transition flex items-center" disabled>
                            <i class="fa fa-play mr-2"></i>开始批量生成
                        </button>
                    </div>
                </div>
            </div>

            <div id="batchProgressContainer" class="bg-white rounded-xl shadow-md p-6 hidden">
                <h2 class="text-lg font-semibold text-dark mb-4 flex items-center">
                    <i class="fa fa-spinner fa-spin text-primary mr-2"></i>批量生成进度
                </h2>
                <div class="w-full bg-gray-200 rounded-full h-2.5 mb-4">
                    <div id="batchProgressBar" class="bg-primary h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
                <p id="batchProgressText" class="text-sm text-gray-500 text-center">准备就绪</p>
                <div id="batchResults" class="mt-6 space-y-3">
                </div>
            </div>
        </div>

        <!-- 脚本模板标签页 -->
        <div id="templates-tab" class="tab-content hidden">
            <div class="bg-white rounded-xl shadow-md p-6 mb-8">
                <h2 class="text-lg font-semibold text-dark mb-4 flex items-center">
                    <i class="fa fa-book text-primary mr-2"></i>脚本模板库
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-6">
                </div>
                <div class="flex justify-end">
                    <button id="saveTemplateBtn" class="px-4 py-2 bg-primary text-white rounded-md hover:bg-primary/90 transition flex items-center">
                        <i class="fa fa-save mr-2"></i>保存当前脚本为模板
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-white shadow-inner mt-16 py-6">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-gray-500 text-sm">

        // 测试Seedance API - 使用正确的端点
        async function testSeedanceApi() {
            const testBtn = document.getElementById('testSeedanceBtn');
            const apiStatus = document.getElementById('seedanceApiStatus');

            testBtn.disabled = true;
            testBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-1"></i>测试中...';
            apiStatus.textContent = 'Seedance: 测试中...';
            apiStatus.className = 'text-sm text-yellow-500';

            try {
                const apiKey = document.getElementById('seedanceApiKey').value.trim();
                if (!apiKey) {
                    throw new Error('请先输入Seedance API密钥');
                }

                // 用最小的有效请求测试连通性 (创建一个最短的视频生成任务来验证API可用)
                // 官方没有独立的连通性测试端点, 发送一个最小duration的任务并立即检查状态
                const response = await fetch(SEEDANCE_CREATE_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: SEEDANCE_MODEL,
                        content: [{ type: 'text', text: 'test connection' }],
                        resolution: '480p',
                        ratio: '1:1',
                        duration: 4,
                        watermark: false,
                        generate_audio: false,
                        service_tier: 'default'
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    apiStatus.textContent = `Seedance: 连接成功 ✓ (task: ${data.id})`;
                    apiStatus.className = 'text-sm text-green-500';
                    alert(`Seedance API连接成功!\n任务ID: ${data.id}\n端点: ${SEEDANCE_CREATE_URL}\n模型: ${SEEDANCE_MODEL}`);
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    const errMsg = errorData.error?.message || `HTTP ${response.status}`;
                    throw new Error(errMsg);
                }
            } catch (error) {
                console.error('Seedance API测试失败:', error);
                apiStatus.textContent = `Seedance: 失败 - ${error.message}`;
                apiStatus.className = 'text-sm text-red-500';
                alert(`Seedance API测试失败:\n${error.message}\n\n正确端点: ${SEEDANCE_CREATE_URL}\n请检查:\n1. API密钥是否正确\n2. 火山方舟账号是否开通了Seedance 2.0模型\n3. 账号余额是否 >= 200元`);
            } finally {
                testBtn.disabled = false;
                testBtn.innerHTML = '<i class="fa fa-check mr-1"></i>测试Seedance';
            }
        }

            if (template.segments && template.segments.length > 0) {

            if (!name) return;
            const description = prompt('请输入模板描述:');
            if (!description) return;
            const currentSegments = segments.map((seg, i) => ({
                ...seg,
                prompt: document.getElementById(`prompt-${i}`).value
            }));
            const newTemplate = {
                id: Date.now(),
                name, description,
                basePrompt: document.getElementById('basePrompt').value,
                segments: currentSegments

            updateBatchTemplateSelect();
            alert('模板删除成功!');

                        <span id="segment-status-${i}" class="px-2 py-1 text-xs rounded-full bg-gray-100 text-gray-600">待生成</span>

                                    '<i class="fa fa-upload text-2xl mb-1"></i>点击上传首帧</label>' :
                                    '<span class="text-gray-400 text-sm">自动从上一个片段获取</span>'

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">尾帧预览</label>
                            <div id="last-frame-${i}" class="w-full h-32 bg-gray-100 rounded-md flex items-center justify-center border-2 border-dashed border-gray-300">

        function handleFirstFrameUpload(segmentIndex, input) {
            if (input.files && input.files[0]) {

                    segments[segmentIndex].firstFrame = e.target.result;
                    document.getElementById(`first-frame-${segmentIndex}`).innerHTML =
                        `<img src="${e.target.result}" class="w-full h-full object-contain rounded-md">`;
                };

        // ============================================================
        // DeepSeek 脚本生成
        // ============================================================
        async function generateScript() {
            const basePrompt = document.getElementById('basePrompt').value;
            if (!basePrompt.trim()) { alert('请输入基本提示词'); return; }

            const apiKey = document.getElementById('deepseekApiKey').value.trim();
            if (!apiKey) { alert('请先设置DeepSeek V4 Pro API Key'); return; }

            const totalDuration = parseInt(document.getElementById('totalDuration').value);
            const segmentCount = totalDuration / 10;
            const style = document.getElementById('style').value;

            const btn = document.getElementById('generateScriptBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i>正在生成脚本...';

            try {
                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [
                            {
                                role: 'system',
                                content: `你是一个专业的AI视频脚本生成专家，擅长为Seedance 2.0生成精准的提示词。
请根据用户的基本提示词，生成一个${totalDuration}秒的视频脚本，拆分为${segmentCount}个10秒的片段。
每个片段都要有独立的起承转合，且上一个片段的结尾动作要与下一个片段的开头动作自然衔接。
每个片段的提示词要包含：画面内容、动作、运镜、特效、氛围。
风格要求：${style}
严格按照以下JSON格式输出，不要添加任何额外内容：
{
    "segments": [
        { "prompt": "片段1的提示词" },
        { "prompt": "片段2的提示词" }
    ]
}`
                            },
                            { role: 'user', content: basePrompt }
                        ],
                        temperature: 0.7,
                        response_format: { type: "json_object" }
                    })
                });

                if (!response.ok) throw new Error(`API错误: HTTP ${response.status}`);

                const data = await response.json();
                const script = JSON.parse(data.choices[0].message.content);

                for (let i = 0; i < script.segments.length && i < segments.length; i++) {
                    document.getElementById(`prompt-${i}`).value = script.segments[i].prompt;
                    segments[i].prompt = script.segments[i].prompt;
                }
                alert('脚本生成成功!');
            } catch (error) {
                console.error('生成脚本失败:', error);
                alert(`生成脚本失败: ${error.message}`);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa fa-wand-magic-sparkles mr-2"></i>生成完整分镜脚本';
            }
        }

        // ============================================================
        // Seedance 2.0 视频生成 - 使用正确的API端点和参数
        // ============================================================

        /**
         * 构建Seedance 2.0 API请求体
         * 官方请求体格式:
         * {
         *   model: "doubao-seedance-2-0-260128",
         *   content: [
         *     { type: "image_url", image_url: { url: "..." }, role: "first_frame" },  // 可选首帧
         *     { type: "text", text: "prompt including style and negative" }
         *   ],
         *   resolution: "720p",
         *   ratio: "9:16",
         *   duration: 10,
         *   seed: 123456,
         *   watermark: false,
         *   generate_audio: true,
         *   return_last_frame: true,
         *   service_tier: "default"
         * }
         */
        function buildSeedanceRequest(segmentIndex) {
            const seg = segments[segmentIndex];
            const prompt = document.getElementById(`prompt-${segmentIndex}`).value.trim();
            const style = document.getElementById('style').value.trim();
            const negativePrompt = document.getElementById('negativePrompt').value.trim();
            const ratio = document.getElementById('aspectRatio').value;
            const resolution = document.getElementById('resolution').value;
            const seed = parseInt(document.getElementById('seed').value);
            const serviceTier = document.getElementById('serviceTier').value;

            // 合并完整提示词: 主提示词 + 风格 + 负面提示词
            let fullPrompt = prompt;
            if (style) fullPrompt += `, ${style}`;
            if (negativePrompt) fullPrompt += `, avoid: ${negativePrompt}`;

            // content数组 - 官方格式
            const contentArray = [];

            // 首帧参考图 (图生视频)
            if (seg.firstFrame && seg.firstFrame.startsWith('data:image')) {
                contentArray.push({
                    type: 'image_url',
                    image_url: { url: seg.firstFrame },
                    role: 'first_frame'
                });
            }

            // 文本提示词
            contentArray.push({
                type: 'text',
                text: fullPrompt
            });

            const body = {
                model: SEEDANCE_MODEL,
                content: contentArray,
                resolution: resolution,
                ratio: ratio,
                duration: 10,           // 每个片段固定10秒 (在Seedance支持的4-15s范围内)
                seed: seed,
                watermark: false,
                generate_audio: true,
                return_last_frame: true, // 关键: 获取尾帧用于串联下一片段
                service_tier: serviceTier
            };

            return body;
        }

        async function generateSingleVideo(segmentIndex) {
            const apiKey = document.getElementById('seedanceApiKey').value.trim();
            if (!apiKey) { alert('请先设置Seedance 2.0 API Key'); return null; }

            const promptEl = document.getElementById(`prompt-${segmentIndex}`);
            if (!promptEl.value.trim()) {
                alert(`请先输入片段 ${segmentIndex+1} 的提示词`);
                return null;
            }

            segments[segmentIndex].status = 'generating';
            updateSegmentStatus(segmentIndex, '生成中', 'bg-blue-100 text-blue-600');
            updateProgressText(`正在提交片段 ${segmentIndex+1}/${segments.length}...`);

            try {
                const requestBody = buildSeedanceRequest(segmentIndex);
                console.log(`[Seedance] 创建任务 segment=${segmentIndex}`, JSON.stringify(requestBody, null, 2));

                // Step 1: 创建视频生成任务 (使用官方正确端点)
                const createResponse = await fetch(SEEDANCE_CREATE_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify(requestBody)
                });

                if (!createResponse.ok) {
                    const errData = await createResponse.json().catch(() => ({}));
                    throw new Error(`创建任务失败: ${errData.error?.message || `HTTP ${createResponse.status}`}`);
                }

                const createData = await createResponse.json();
                const taskId = createData.id;
                segments[segmentIndex].taskId = taskId;
                console.log(`[Seedance] 任务已创建 taskId=${taskId}`);

                // Step 2: 轮询任务状态 (使用官方正确端点)
                let videoUrl = null;
                let lastFrame = null;
                let attempts = 0;
                const maxAttempts = 90;
                const pollInterval = 3000;

                while (attempts < maxAttempts) {
                    if (!isGenerating && currentGeneratingIndex !== segmentIndex) {
                        // 如果是在单独生成模式下，检查是否被停止
                        if (segments[segmentIndex].status === 'failed') break;
                    }

                    attempts++;
                    await new Promise(resolve => setTimeout(resolve, pollInterval));

                    const queryUrl = `${SEEDANCE_CREATE_URL}/${taskId}`;
                    const statusResponse = await fetch(queryUrl, {
                        headers: { 'Authorization': `Bearer ${apiKey}` }
                    });

                    if (!statusResponse.ok) {
                        const errData = await statusResponse.json().catch(() => ({}));
                        throw new Error(`查询状态失败: ${errData.error?.message || `HTTP ${statusResponse.status}`}`);
                    }

                    const statusData = await statusResponse.json();
                    console.log(`[Seedance] 轮询 taskId=${taskId} status=${statusData.status} attempt=${attempts}`);

                    // 官方状态: "queued" | "running" | "succeeded" | "failed"
                    if (statusData.status === 'succeeded') {
                        // 从响应中提取视频URL
                        // 官方响应: content 数组中包含生成的视频
                        if (statusData.content && statusData.content.length > 0) {
                            for (const item of statusData.content) {
                                if (item.type === 'video_url' && item.video_url?.url) {
                                    videoUrl = item.video_url.url;
                                }
                                // 尾帧图 (由 return_last_frame: true 返回)
                                if (item.type === 'image_url' && item.role === 'last_frame' && item.image_url?.url) {
                                    lastFrame = item.image_url.url;
                                }
                            }
                        }
                        // 兼容其他可能响应格式
                        if (!videoUrl && statusData.output?.video_url) {
                            videoUrl = statusData.output.video_url;
                        }
                        if (!lastFrame && statusData.output?.last_frame_url) {
                            lastFrame = statusData.output.last_frame_url;
                        }
                        break;
                    } else if (statusData.status === 'failed') {
                        throw new Error('视频生成失败: ' + (statusData.error?.message || '未知错误'));
                    } else if (statusData.status === 'queued') {
                        updateProgressText(`片段 ${segmentIndex+1} 排队中... (${attempts*3}s)`);
                    } else if (statusData.status === 'running') {
                        updateProgressText(`正在生成片段 ${segmentIndex+1}/${segments.length} (${Math.round(attempts/maxAttempts*100)}%)`);
                    }
                }

                if (!videoUrl) {
                    throw new Error('视频生成超时 (等待约5分钟)，请检查火山方舟控制台');
                }

                // 保存结果
                segments[segmentIndex].videoUrl = videoUrl;
                segments[segmentIndex].lastFrame = lastFrame;
                segments[segmentIndex].status = 'completed';

                updateSegmentStatus(segmentIndex, '已完成', 'bg-green-100 text-green-600');
                if (lastFrame) {
                    document.getElementById(`last-frame-${segmentIndex}`).innerHTML =
                        `<img src="${lastFrame}" class="w-full h-full object-contain rounded-md">`;
                }

                // 自动将尾帧传递给下一片段作为首帧
                if (segmentIndex < segments.length - 1 && lastFrame) {
                    segments[segmentIndex + 1].firstFrame = lastFrame;
                    document.getElementById(`first-frame-${segmentIndex + 1}`).innerHTML =
                        `<img src="${lastFrame}" class="w-full h-full object-contain rounded-md">`;
                }

                addToResults(segmentIndex, videoUrl);
                updateSourceVideoSelect();
                updateProgressText(`片段 ${segmentIndex+1} 生成完成`);
                return videoUrl;

            } catch (error) {
                console.error(`生成片段 ${segmentIndex+1} 失败:`, error);
                segments[segmentIndex].status = 'failed';
                updateSegmentStatus(segmentIndex, '失败', 'bg-red-100 text-red-600');
                updateProgressText(`生成片段 ${segmentIndex+1} 失败: ${error.message}`);
                alert(`生成片段 ${segmentIndex+1} 失败:\n${error.message}`);
                return null;
            }
        }

        function updateSegmentStatus(segmentIndex, text, className) {
            const el = document.getElementById(`segment-status-${segmentIndex}`);
            if (el) {
                el.textContent = text;
                el.className = `px-2 py-1 text-xs rounded-full ${className}`;
            }
        }

        function addToResults(segmentIndex, videoUrl) {
            const container = document.getElementById('resultsContainer');
            const div = document.createElement('div');
            div.id = `result-${segmentIndex}`;
            div.className = 'bg-gray-50 rounded-lg overflow-hidden shadow-sm';
            div.innerHTML = `
                <div class="aspect-video bg-black">
                    <video src="${videoUrl}" controls class="w-full h-full object-contain"></video>
                </div>
                <div class="p-3">
                    <h4 class="font-medium text-dark">片段 ${segmentIndex+1}</h4>
                    <div class="mt-2 flex justify-end">
                        <a href="${videoUrl}" download class="text-primary text-sm hover:underline">下载视频</a>
                    </div>
                </div>
            `;
            container.appendChild(div);
            generatedVideos.push({ index: segmentIndex, url: videoUrl });
        }

        function updateSourceVideoSelect() {
            const select = document.getElementById('sourceVideo');
            select.innerHTML = '<option value="">请选择源视频</option>';
            generatedVideos.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v.index;
                opt.textContent = `片段 ${v.index+1}`;
                select.appendChild(opt);
            });
            if (generatedVideos.length > 0) {
                const opt = document.createElement('option');
                opt.value = 'final';
                opt.textContent = '完整拼接视频';
                select.appendChild(opt);
            }
        }

        // ============================================================
        // 批量生成控制
        // ============================================================
        async function generateNextVideo() {
            if (isGenerating) return;
            const nextIndex = segments.findIndex(s => s.status === 'pending');
            if (nextIndex === -1) { alert('所有片段都已生成完毕'); return; }

            isGenerating = true;
            currentGeneratingIndex = nextIndex;
            document.getElementById('stopBtn').disabled = false;
            updateProgress(nextIndex);

            await generateSingleVideo(nextIndex);

            isGenerating = false;
            currentGeneratingIndex = -1;
            document.getElementById('stopBtn').disabled = true;
            updateProgress(nextIndex + 1);
        }

        async function generateAllVideos() {
            if (isGenerating) return;
            isGenerating = true;
            document.getElementById('stopBtn').disabled = false;

            for (let i = 0; i < segments.length; i++) {
                if (!isGenerating) break;
                if (segments[i].status === 'completed') continue;
                currentGeneratingIndex = i;
                updateProgress(i);
                const success = await generateSingleVideo(i);
                if (!success) { isGenerating = false; break; }
            }

            isGenerating = false;
            currentGeneratingIndex = -1;
            document.getElementById('stopBtn').disabled = true;
            updateProgress(segments.length);

            if (segments.every(s => s.status === 'completed')) {
                updateProgressText('所有视频生成完毕，可以开始拼接');
                alert('所有视频生成完毕!');
            }
        }

        function stopGeneration() {
            isGenerating = false;
            document.getElementById('stopBtn').disabled = true;
            updateProgress(currentGeneratingIndex);
            updateProgressText('生成已停止');
            alert('生成已停止');
        }

        function updateProgress(completedCount) {
            const pct = Math.round((completedCount / segments.length) * 100);
            document.getElementById('progressBar').style.width = `${pct}%`;
        }

        function updateProgressText(text) {
            document.getElementById('progressText').textContent = text;
        }

        // ============================================================
        // FFmpeg 视频拼接
        // ============================================================
        async function concatenateVideos() {
            if (!ffmpegLoaded) { alert('FFmpeg尚未加载完成，请稍候再试'); return; }

            const completedVideos = segments.filter(s => s.status === 'completed');
            if (completedVideos.length === 0) { alert('没有已生成的视频可以拼接'); return; }
            if (completedVideos.length !== segments.length) {
                if (!confirm(`只有 ${completedVideos.length}/${segments.length} 个片段已生成，是否继续拼接?`)) return;
            }

            const btn = document.getElementById('concatenateBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i>正在拼接视频...';
            updateProgressText('正在准备拼接...');

            try {
                const videoUrls = segments
                    .filter(s => s.status === 'completed')
                    .sort((a, b) => a.id - b.id)
                    .map(s => s.videoUrl);

                updateProgressText('正在下载视频片段...');
                const videoBlobs = [];
                for (let i = 0; i < videoUrls.length; i++) {
                    updateProgressText(`正在下载片段 ${i+1}/${videoUrls.length}`);
                    const response = await fetch(videoUrls[i]);
                    const blob = await response.blob();
                    videoBlobs.push(blob);
                }

                updateProgressText('正在处理视频...');
                for (let i = 0; i < videoBlobs.length; i++) {
                    await ffmpeg.writeFile(`segment${i}.mp4`, await FFmpegUtil.fetchFile(videoBlobs[i]));
                }

                let concatContent = '';
                for (let i = 0; i < videoBlobs.length; i++) {
                    concatContent += `file 'segment${i}.mp4'\n`;
                }
                await ffmpeg.writeFile('concat.txt', concatContent);

                updateProgressText('正在拼接视频...');
                await ffmpeg.exec(['-f', 'concat', '-safe', '0', '-i', 'concat.txt', '-c', 'copy', 'output.mp4']);

                const data = await ffmpeg.readFile('output.mp4');
                const videoBlob = new Blob([data.buffer], { type: 'video/mp4' });
                const videoUrl = URL.createObjectURL(videoBlob);

                document.getElementById('finalVideo').src = videoUrl;
                document.getElementById('downloadFinalBtn').href = videoUrl;
                document.getElementById('finalResultContainer').classList.remove('hidden');

                for (let i = 0; i < videoBlobs.length; i++) {
                    await ffmpeg.deleteFile(`segment${i}.mp4`);
                }
                await ffmpeg.deleteFile('concat.txt');
                await ffmpeg.deleteFile('output.mp4');

                updateSourceVideoSelect();
                updateProgressText('视频拼接完成!');
                alert('视频拼接完成!');
            } catch (error) {
                console.error('视频拼接失败:', error);
                updateProgressText(`视频拼接失败: ${error.message}`);
                alert(`视频拼接失败: ${error.message}`);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa fa-compress mr-2"></i>拼接所有视频';
            }
        }

        // ============================================================
        // 视频拆解
        // ============================================================
        function handleVideoUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('analyzeVideoBtn').disabled = false;
            updateProgressText(`已选择视频: ${file.name}`);
        }

        async function analyzeVideo() {
            const file = document.getElementById('videoUpload').files[0];
            if (!file) { alert('请先上传视频文件'); return; }
            const apiKey = document.getElementById('deepseekApiKey').value.trim();
            if (!apiKey) { alert('请先设置DeepSeek V4 Pro API Key'); return; }

            const btn = document.getElementById('analyzeVideoBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i>正在分析视频...';
            updateProgressText('正在分析视频内容...');

            try {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    const base64Video = e.target.result.split(',')[1];

                    const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            model: 'deepseek-chat',
                            messages: [
                                {
                                    role: 'system',
                                    content: `你是一个专业的视频内容分析专家，擅长拆解短视频营销脚本。
请分析上传的视频，将其拆分为10秒一个的片段，每个片段包含：
1. 时间范围 2. 画面内容 3. 动作描述 4. 运镜方式 5. 特效描述 6. 台词/字幕 7. 适合Seedance 2.0生成的提示词
严格按照以下JSON格式输出:
{
    "videoInfo": { "totalDuration": "...", "style": "...", "aspectRatio": "..." },
    "segments": [
        { "timeRange": "0-10秒", "content": "...", "action": "...", "camera": "...", "effects": "...", "dialogue": "...", "prompt": "..." }
    ]
}`
                                },
                                {
                                    role: 'user',
                                    content: [{ type: 'video', video: { url: `data:video/mp4;base64,${base64Video}` } }]
                                }
                            ],
                            temperature: 0.3,
                            response_format: { type: "json_object" }
                        })
                    });

                    if (!response.ok) throw new Error(`API错误: HTTP ${response.status}`);

                    const data = await response.json();
                    currentAnalysisResult = JSON.parse(data.choices[0].message.content);
                    renderAnalysisResult(currentAnalysisResult);
                    document.getElementById('analysisResultContainer').classList.remove('hidden');
                    updateProgressText('视频分析完成!');
                };
                reader.readAsDataURL(file);
            } catch (error) {
                console.error('视频分析失败:', error);
                updateProgressText(`视频分析失败: ${error.message}`);
                alert(`视频分析失败: ${error.message}`);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa fa-search mr-2"></i>开始拆解视频';
            }
        }

        function renderAnalysisResult(result) {
            const container = document.getElementById('analysisResult');
            container.innerHTML = '';
            const infoDiv = document.createElement('div');
            infoDiv.className = 'bg-gray-50 rounded-lg p-4 mb-4';
            infoDiv.innerHTML = `
                <h3 class="font-medium text-dark mb-2">视频基本信息</h3>
                <p><strong>总时长:</strong> ${result.videoInfo.totalDuration}</p>
                <p><strong>风格:</strong> ${result.videoInfo.style}</p>
                <p><strong>画幅比例:</strong> ${result.videoInfo.aspectRatio}</p>
            `;
            container.appendChild(infoDiv);

            result.segments.forEach((segment, index) => {
                const div = document.createElement('div');
                div.className = 'bg-gray-50 rounded-lg p-4 mb-4';
                div.innerHTML = `
                    <h3 class="font-medium text-dark mb-2">片段 ${index+1}: ${segment.timeRange}</h3>
                    <p><strong>画面内容:</strong> ${segment.content}</p>
                    <p><strong>动作:</strong> ${segment.action}</p>
                    <p><strong>运镜:</strong> ${segment.camera}</p>
                    <p><strong>特效:</strong> ${segment.effects}</p>
                    <p><strong>台词:</strong> ${segment.dialogue}</p>
                    <div class="mt-2">
                        <strong>Seedance提示词:</strong>
                        <p class="text-sm text-gray-600 mt-1 bg-white p-2 rounded border">${segment.prompt}</p>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function applyAnalysisScript() {
            if (!currentAnalysisResult) return;
            if (currentAnalysisResult.videoInfo.aspectRatio) {
                document.getElementById('aspectRatio').value = currentAnalysisResult.videoInfo.aspectRatio;
            }
            const segmentCount = currentAnalysisResult.segments.length;
            document.getElementById('totalDuration').value = segmentCount * 10;
            updateSegmentsContainer();
            currentAnalysisResult.segments.forEach((segment, index) => {
                if (index < segments.length) {
                    document.getElementById(`prompt-${index}`).value = segment.prompt;
                    segments[index].prompt = segment.prompt;
                }
            });
            switchTab('generator');
            alert('脚本已应用到视频生成页面!');
        }

        // ============================================================
        // 多语言本地化
        // ============================================================
        async function localizeVideo() {
            const sourceVideoIndex = document.getElementById('sourceVideo').value;
            if (!sourceVideoIndex) { alert('请选择源视频'); return; }
            const targetLanguages = Array.from(document.querySelectorAll('.target-language:checked')).map(cb => cb.value);
            if (targetLanguages.length === 0) { alert('请至少选择一种目标语言'); return; }
            const apiKey = document.getElementById('deepseekApiKey').value.trim();
            if (!apiKey) { alert('请先设置DeepSeek V4 Pro API Key'); return; }

            const btn = document.getElementById('localizeBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i>正在生成本地化版本...';

            try {
                const resultsContainer = document.getElementById('localizationResults');
                resultsContainer.innerHTML = '';
                document.getElementById('localizationResultContainer').classList.remove('hidden');

                for (let i = 0; i < targetLanguages.length; i++) {
                    const lang = targetLanguages[i];
                    updateProgressText(`正在生成${getLanguageName(lang)}版本...`);
                    await new Promise(resolve => setTimeout(resolve, 2000));

                    const div = document.createElement('div');
                    div.className = 'bg-gray-50 rounded-lg overflow-hidden shadow-sm';
                    div.innerHTML = `
                        <div class="aspect-video bg-black flex items-center justify-center">
                            <p class="text-white">${getLanguageName(lang)}版本</p>
                        </div>
                        <div class="p-3">
                            <h4 class="font-medium text-dark">${getLanguageName(lang)}</h4>
                            <div class="mt-2 flex justify-end">
                                <button class="text-primary text-sm hover:underline">下载视频</button>
                            </div>
                        </div>
                    `;
                    resultsContainer.appendChild(div);
                }
                updateProgressText('所有本地化版本生成完成!');
                alert('多语言本地化完成!');
            } catch (error) {
                console.error('本地化失败:', error);
                updateProgressText(`本地化失败: ${error.message}`);
                alert(`本地化失败: ${error.message}`);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa fa-language mr-2"></i>生成本地化版本';
            }
        }

        function getLanguageName(code) {
            const map = { en: '英语', es: '西班牙语', pt: '葡萄牙语', ja: '日语', ko: '韩语', fr: '法语', zh: '中文' };
            return map[code] || code;
        }

        // ============================================================
        // 批量生成
        // ============================================================
        function handleProductUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let workbook;
                    if (file.name.endsWith('.csv')) {
                        workbook = XLSX.read(e.target.result, { type: 'binary' });
                    } else {
                        workbook = XLSX.read(e.target.result, { type: 'array' });
                    }
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const data = XLSX.utils.sheet_to_json(firstSheet);
                    if (data.length === 0) { alert('产品表为空'); return; }
                    products = data;
                    renderProductPreview(data);
                    document.getElementById('productPreview').classList.remove('hidden');
                    document.getElementById('batchGenerateBtn').disabled = false;
                    updateProgressText(`已加载 ${data.length} 个产品`);
                } catch (error) {
                    console.error('解析产品表失败:', error);
                    alert('解析产品表失败，请检查文件格式');
                }
            };
            if (file.name.endsWith('.csv')) {
                reader.readAsBinaryString(file);
            } else {
                reader.readAsArrayBuffer(file);
            }
        }

        function renderProductPreview(data) {
            const header = document.getElementById('productTableHeader');
            const body = document.getElementById('productTableBody');
            header.innerHTML = '';
            Object.keys(data[0]).forEach(key => {
                const th = document.createElement('th');
                th.className = 'px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider';
                th.textContent = key;
                header.appendChild(th);
            });
            body.innerHTML = '';
            data.slice(0, 5).forEach(row => {
                const tr = document.createElement('tr');
                Object.values(row).forEach(value => {
                    const td = document.createElement('td');
                    td.className = 'px-4 py-2 whitespace-nowrap text-sm text-gray-500';
                    td.textContent = value;
                    tr.appendChild(td);
                });
                body.appendChild(tr);
            });
            if (data.length > 5) {
                const tr = document.createElement('tr');
                const td = document.createElement('td');
                td.colSpan = Object.keys(data[0]).length;
                td.className = 'px-4 py-2 text-center text-sm text-gray-500';
                td.textContent = `... 还有 ${data.length - 5} 个产品`;
                tr.appendChild(td);
                body.appendChild(tr);
            }
        }

        async function batchGenerate() {
            const templateId = document.getElementById('batchTemplate').value;
            if (!templateId) { alert('请选择脚本模板'); return; }
            if (products.length === 0) { alert('请先上传产品表'); return; }

            const template = templates.find(t => t.id === parseInt(templateId));
            if (!template) { alert('模板不存在'); return; }

            const btn = document.getElementById('batchGenerateBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i>正在批量生成...';
            document.getElementById('batchProgressContainer').classList.remove('hidden');

            try {
                const resultsContainer = document.getElementById('batchResults');
                resultsContainer.innerHTML = '';

                for (let i = 0; i < products.length; i++) {
                    const product = products[i];
                    const pct = Math.round(((i + 1) / products.length) * 100);
                    document.getElementById('batchProgressBar').style.width = `${pct}%`;
                    document.getElementById('batchProgressText').textContent =
                        `正在生成 ${i+1}/${products.length}: ${product['产品名称'] || product.name}`;

                    await new Promise(resolve => setTimeout(resolve, 1000));

                    const div = document.createElement('div');
                    div.className = 'flex justify-between items-center p-3 bg-gray-50 rounded-lg';
                    div.innerHTML = `
                        <span>${product['产品名称'] || product.name}</span>
                        <span class="text-green-600">生成成功</span>
                    `;
                    resultsContainer.appendChild(div);
                }
                document.getElementById('batchProgressText').textContent = `批量生成完成! 共生成 ${products.length} 个视频`;
                alert('批量生成完成!');
            } catch (error) {
                console.error('批量生成失败:', error);
                document.getElementById('batchProgressText').textContent = `批量生成失败: ${error.message}`;
                alert(`批量生成失败: ${error.message}`);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa fa-play mr-2"></i>开始批量生成';
            }
        }
    </script>

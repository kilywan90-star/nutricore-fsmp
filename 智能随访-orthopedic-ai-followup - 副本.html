<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四川省骨科医院 · AI 智能随访系统</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --primary:#0D47A1; --primary-light:#1565C0; --primary-bg:#E3F2FD;
  --secondary:#00897B; --secondary-light:#00BFA5;
  --bg:#F0F4F8; --card:#FFFFFF; --text:#1A2332; --text2:#5A6C7D; --text3:#8899AA;
  --border:#E8EDF2; --shadow:0 2px 12px rgba(0,0,0,.06);
  --radius:12px; --radius-sm:8px;
  --green:#10B981; --yellow:#F59E0B; --red:#EF4444; --blue:#3B82F6; --purple:#8B5CF6;
  --orange:#F97316; --pink:#EC4899;
  --sidebar-w:240px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);font-size:14px;display:flex;min-height:100vh;overflow-x:hidden}
a{text-decoration:none;color:inherit}

/* ===== SIDEBAR ===== */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);background:linear-gradient(180deg,#0D47A1 0%,#0A3A8A 100%);color:#fff;z-index:100;display:flex;flex-direction:column;transition:transform .3s}
.sidebar-brand{padding:24px 20px 20px;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar-brand .logo{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px}
.sidebar-brand .logo i{font-size:26px;color:#4FC3F7}
.sidebar-brand .sub{font-size:12px;opacity:.7;margin-top:4px;padding-left:36px}
.sidebar-nav{flex:1;padding:12px 0;overflow-y:auto}
.sidebar-nav .nav-group{padding:0 12px;margin-top:8px}
.sidebar-nav .nav-group:first-child{margin-top:0}
.sidebar-nav .nav-label{font-size:11px;text-transform:uppercase;opacity:.5;padding:8px 12px 4px;letter-spacing:.5px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:8px;cursor:pointer;transition:all .2s;margin:2px 0;font-size:14px;color:rgba(255,255,255,.75);position:relative}
.nav-item:hover{background:rgba(255,255,255,.12);color:#fff}
.nav-item.active{background:rgba(255,255,255,.18);color:#fff;font-weight:600}
.nav-item i{width:20px;text-align:center;font-size:16px}
.nav-item .alert-dot{width:8px;height:8px;border-radius:50%;position:absolute;right:12px;top:50%;margin-top:-4px}
.nav-item .alert-dot.red{background:var(--red);animation:pulse 2s infinite}
.sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;opacity:.6;text-align:center}

/* ===== MAIN ===== */
.main{margin-left:var(--sidebar-w);flex:1;min-height:100vh}
.header{background:var(--card);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.header h2{font-size:18px;font-weight:600}
.header-right{display:flex;align-items:center;gap:16px}
.header-right .badge{background:var(--red);color:#fff;font-size:11px;padding:2px 8px;border-radius:12px;margin-left:4px}
.header-right .time{color:var(--text2);font-size:13px}
.content{padding:24px 28px}

/* ===== PAGE SYSTEM ===== */
.page{display:none;animation:fadeIn .35s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ===== CARDS ===== */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:20px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.card-header h3{font-size:16px;font-weight:600}
.card-header .tag{font-size:12px;padding:2px 10px;border-radius:12px;background:var(--primary-bg);color:var(--primary)}
.row{display:grid;gap:20px}
.row-2{grid-template-columns:1fr 1fr}
.row-3{grid-template-columns:1fr 1fr 1fr}
.row-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1024px){.row-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.row-2,.row-3,.row-4{grid-template-columns:1fr}}

/* ===== STAT CARDS ===== */
.stat-card{padding:20px;border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow)}
.stat-card .stat-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:12px}
.stat-card .stat-label{font-size:13px;color:var(--text2);margin-bottom:4px}
.stat-card .stat-value{font-size:26px;font-weight:700}
.stat-card .stat-change{font-size:12px;margin-top:4px;display:flex;align-items:center;gap:4px}
.stat-card .stat-sub{font-size:12px;color:var(--text3);margin-top:2px}

/* ===== COMPARE BAR ===== */
.compare-bar{display:flex;align-items:center;gap:16px;margin:4px 0}
.compare-bar .bar-track{flex:1;height:8px;background:#E8EDF2;border-radius:4px;overflow:hidden;position:relative}
.compare-bar .bar-fill{height:100%;border-radius:4px;transition:width .8s ease}
.compare-bar .bar-label{font-size:13px;min-width:60px;font-weight:500}

/* ===== TABLE ===== */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;color:var(--text2);font-weight:500;border-bottom:2px solid var(--border);font-size:12px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
th .ck{width:16px;height:16px;accent-color:var(--primary);cursor:pointer}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:#F8FAFC}
.status-tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:500}
.status-tag.green{background:#D1FAE5;color:#065F46}
.status-tag.yellow{background:#FEF3C7;color:#92400E}
.status-tag.red{background:#FEE2E2;color:#991B1B}
.status-tag.blue{background:#DBEAFE;color:#1E40AF}
.status-tag.purple{background:#EDE9FE;color:#5B21B6}
.status-tag.gray{background:#F1F5F9;color:#475569}
.status-tag.orange{background:#FFEDD5;color:#9A3412}
.status-tag.pink{background:#FCE7F3;color:#9D174D}

/* ===== ALERT TIERS ===== */
.alert-tier{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600}
.alert-tier.red{background:#FEE2E2;color:#991B1B;border:1px solid #FECACA}
.alert-tier.red::before{content:'⬤';font-size:8px;color:#EF4444}
.alert-tier.orange{background:#FFEDD5;color:#9A3412;border:1px solid #FED7AA}
.alert-tier.orange::before{content:'⬤';font-size:8px;color:#F97316}
.alert-tier.yellow{background:#FEF3C7;color:#92400E;border:1px solid #FDE68A}
.alert-tier.yellow::before{content:'⬤';font-size:8px;color:#F59E0B}

/* ===== FORM ===== */
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:500;margin-bottom:4px;color:var(--text2)}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;outline:none;transition:border .2s;background:#fff}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(13,71,161,.1)}
.form-group textarea{min-height:70px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{padding:8px 20px;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-light)}
.btn-secondary{background:var(--bg);color:var(--text)}
.btn-secondary:hover{background:var(--border)}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover{opacity:.9}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{opacity:.9}
.btn-warning{background:var(--orange);color:#fff}
.btn-warning:hover{opacity:.9}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text2)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:4px 12px;font-size:12px}
.btn-icon{width:32px;height:32px;padding:0;justify-content:center;border-radius:8px}
.btn-lg{padding:12px 28px;font-size:15px}
.flex{display:flex;align-items:center;gap:8px}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.gap-4{gap:4px}
.mt-12{margin-top:12px}
.mt-16{margin-top:16px}
.mb-8{margin-bottom:8px}
.mb-16{margin-bottom:16px}
.text-center{text-align:center}
.text-sm{font-size:12px;color:var(--text3)}
.text-muted{color:var(--text2)}

/* ===== SEARCH BAR ===== */
.search-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search-bar input{flex:1;min-width:200px;padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;outline:none}
.search-bar input:focus{border-color:var(--primary)}
.search-bar select{padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;outline:none;background:#fff}

/* ===== BATCH BAR ===== */
.batch-bar{display:none;align-items:center;gap:12px;padding:10px 16px;background:#DBEAFE;border-radius:var(--radius-sm);margin-bottom:12px;font-size:13px;animation:slideDown .25s ease}
.batch-bar.show{display:flex}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.batch-bar .count{font-weight:600;color:var(--primary)}

/* ===== FLOW CHART ===== */
.flow-steps{display:flex;align-items:flex-start;justify-content:space-between;padding:20px 0;flex-wrap:wrap;gap:12px}
.flow-step{text-align:center;flex:1;min-width:100px}
.flow-step .step-icon{width:56px;height:56px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;position:relative}
.flow-step .step-icon.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(13,71,161,.4)}70%{box-shadow:0 0 0 12px rgba(13,71,161,0)}100%{box-shadow:0 0 0 0 rgba(13,71,161,0)}}
.flow-step .step-label{font-size:12px;font-weight:500;color:var(--text2)}
.flow-step .step-desc{font-size:11px;color:var(--text3);margin-top:2px}

/* ===== CLOSED-LOOP ===== */
.closed-loop{display:flex;align-items:center;justify-content:center;gap:0;padding:10px 0;flex-wrap:wrap}
.loop-node{text-align:center;min-width:90px;padding:12px 8px}
.loop-node .node-icon{width:48px;height:48px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;position:relative}
.loop-node .node-label{font-size:11px;font-weight:500;color:var(--text2)}
.loop-arrow{color:var(--text3);font-size:14px;padding:0 4px}

/* ===== TIMELINE ===== */
.timeline{position:relative;padding-left:28px}
.timeline::before{content:'';position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--border)}
.timeline-item{position:relative;padding:0 0 20px 16px}
.timeline-item::before{content:'';position:absolute;left:-24px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--primary);border:2px solid var(--primary-bg)}
.timeline-item.green::before{background:var(--green)}
.timeline-item.yellow::before{background:var(--yellow)}
.timeline-item.red::before{background:var(--red)}
.timeline-item.orange::before{background:var(--orange)}
.timeline-item .tl-time{font-size:11px;color:var(--text3);margin-bottom:2px}
.timeline-item .tl-title{font-weight:500;font-size:14px}
.timeline-item .tl-desc{font-size:12px;color:var(--text2);margin-top:2px}

/* ===== COMPARISON ===== */
.comparison-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:768px){.comparison-grid{grid-template-columns:1fr}}
.comp-card{border-radius:var(--radius);padding:20px}
.comp-card.before{background:#FEF2F2;border:1px solid #FECACA}
.comp-card.after{background:#ECFDF5;border:1px solid #A7F3D0}
.comp-card h4{font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.comp-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(0,0,0,.05)}
.comp-item:last-child{border-bottom:none}
.comp-item .label{font-size:13px;color:var(--text2)}
.comp-item .value{font-weight:600;font-size:15px}

/* ===== MODAL ===== */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:var(--radius);padding:24px;width:90%;max-width:560px;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal h3{font-size:17px;margin-bottom:16px}

/* ===== MISC ===== */
.alert{background:#FEF3C7;border:1px solid #FDE68A;border-radius:var(--radius-sm);padding:12px 16px;font-size:13px;color:#92400E;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.alert.info{background:#DBEAFE;border-color:#93C5FD;color:#1E40AF}
.alert.success{background:#D1FAE5;border-color:#6EE7B7;color:#065F46}
.alert.danger{background:#FEE2E2;border-color:#FECACA;color:#991B1B}
.tag-group{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;background:var(--bg);color:var(--text2)}
.tag.primary{background:var(--primary-bg);color:var(--primary)}
.tag.green{background:#D1FAE5;color:#065F46}
.tag.yellow{background:#FEF3C7;color:#92400E}
.tag.red{background:#FEE2E2;color:#991B1B}
.tag.orange{background:#FFEDD5;color:#9A3412}
.tag.purple{background:#EDE9FE;color:#5B21B6}

/* ===== SIMULATE BTN ===== */
.simulate-area{text-align:center;padding:30px 20px}
.simulate-btn{width:80px;height:80px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;font-size:32px;cursor:pointer;transition:all .3s;box-shadow:0 4px 20px rgba(13,71,161,.3)}
.simulate-btn:hover{transform:scale(1.08);box-shadow:0 6px 28px rgba(13,71,161,.4)}
.simulate-btn:active{transform:scale(.95)}
.simulate-btn.running{animation:simPulse 1.5s infinite}
@keyframes simPulse{0%{box-shadow:0 0 0 0 rgba(13,71,161,.4)}50%{box-shadow:0 0 0 20px rgba(13,71,161,0)}100%{box-shadow:0 0 0 0 rgba(13,71,161,0)}}
.sim-log{background:#1A2332;color:#E8EDF2;border-radius:var(--radius-sm);padding:12px 16px;font-family:'Courier New',monospace;font-size:12px;line-height:1.8;max-height:200px;overflow-y:auto;text-align:left;margin-top:16px}
.sim-log .line{opacity:0;animation:logIn .3s forwards}
.sim-log .line.info{color:#60A5FA}
.sim-log .line.success{color:#34D399}
.sim-log .line.warn{color:#FBBF24}
.sim-log .line.phone{color:#C084FC}
.sim-log .line.alert-red{color:#F87171}
@keyframes logIn{to{opacity:1}}

/* ===== UPLOAD ZONE ===== */
.upload-zone{border:2px dashed var(--border);border-radius:var(--radius-sm);padding:24px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:12px}
.upload-zone:hover{border-color:var(--primary);background:var(--primary-bg)}
.upload-zone i{font-size:28px;color:var(--text3);margin-bottom:8px}
.upload-zone p{font-size:13px;color:var(--text2)}

/* ===== VOICE BTN ===== */
.voice-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--text2);transition:all .2s}
.voice-btn:hover{border-color:var(--primary);color:var(--primary)}
.voice-btn.recording{background:var(--red);color:#fff;border-color:var(--red);animation:micPulse 1s infinite}
@keyframes micPulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}

/* ===== CHATBOT ===== */
.chat-container{display:flex;flex-direction:column;height:480px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.chat-header{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px}
.chat-header .doc-avatar{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:20px}
.chat-header .doc-info h4{font-size:14px}
.chat-header .doc-info span{font-size:11px;opacity:.8}
.chat-messages{flex:1;overflow-y:auto;padding:16px;background:#F8FAFC;display:flex;flex-direction:column;gap:12px}
.chat-msg{max-width:80%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.5;animation:chatIn .3s ease}
.chat-msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px}
.chat-msg.user{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.chat-msg .msg-time{font-size:10px;opacity:.6;margin-top:4px;display:block}
.chat-msg.bot .msg-time{color:var(--text3)}
.chat-msg.user .msg-time{text-align:right}
@keyframes chatIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.chat-input{display:flex;padding:12px;border-top:1px solid var(--border);gap:8px;background:var(--card)}
.chat-input input{flex:1;padding:8px 14px;border:1px solid var(--border);border-radius:20px;font-size:13px;outline:none}
.chat-input input:focus{border-color:var(--primary)}
.chat-input .chat-send{width:36px;height:36px;border-radius:50%;border:none;background:var(--primary);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.chat-input .chat-send:hover{background:var(--primary-light)}
.quick-reply{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 12px;background:#F8FAFC}
.quick-reply button{font-size:11px;padding:4px 12px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;transition:all .2s}
.quick-reply button:hover{border-color:var(--primary);color:var(--primary)}

/* ===== RISK TAGS ===== */
.risk-cloud{display:flex;flex-wrap:wrap;gap:8px;padding:8px 0}
.risk-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 14px;border-radius:16px;font-size:12px;font-weight:500;cursor:default;transition:all .2s}
.risk-tag.high{background:#FEE2E2;color:#991B1B;border:1px solid #FECACA}
.risk-tag.medium{background:#FFEDD5;color:#9A3412;border:1px solid #FED7AA}
.risk-tag.low{background:#FEF3C7;color:#92400E;border:1px solid #FDE68A}
.risk-tag .count{font-size:10px;opacity:.7}

/* ===== DOCTOR CARD ===== */
.doc-card{display:flex;align-items:center;gap:16px;padding:16px;background:linear-gradient(135deg,#E3F2FD,#F0F4F8);border-radius:var(--radius);margin-bottom:16px}
.doc-card .avatar{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px}
.doc-card .info h3{font-size:15px;margin-bottom:2px}
.doc-card .info p{font-size:12px;color:var(--text2)}

/* ===== INTERNATIONAL TABLE ===== */
.intl-table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0}
.intl-table th{background:var(--primary-bg);padding:8px 10px;font-weight:600;color:var(--primary);text-align:center;border:1px solid #CBD5E1;font-size:11px}
.intl-table td{padding:8px 10px;text-align:center;border:1px solid #E2E8F0;font-size:12px}
.intl-table tr:nth-child(even){background:#F8FAFC}

/* ===== MOBILE TOGGLE ===== */
.mobile-toggle{display:none;position:fixed;top:12px;left:12px;z-index:150;width:40px;height:40px;border-radius:8px;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);cursor:pointer;align-items:center;justify-content:center;font-size:18px}
.alert-history{max-height:300px;overflow-y:auto}
.alert-row{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.alert-row:last-child{border-bottom:none}
.alert-row .al-time{min-width:70px;font-size:11px;color:var(--text3)}
.alert-row .al-content{flex:1}
.alert-row .al-content .al-title{font-weight:500}
.alert-row .al-content .al-desc{font-size:12px;color:var(--text2);margin-top:2px}
/* Profile */
.profile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.profile-item{text-align:center;padding:14px;background:#F8FAFC;border-radius:var(--radius-sm)}
.profile-item .pi-value{font-size:20px;font-weight:700;color:var(--primary)}
.profile-item .pi-label{font-size:11px;color:var(--text3);margin-top:2px}
.profile-item .pi-bar{height:4px;background:#E8EDF2;border-radius:2px;margin-top:6px;overflow:hidden}
.profile-item .pi-bar .pi-fill{height:100%;border-radius:2px}

/* ===== WORKFLOW MODAL ===== */
.modal-wide{max-width:780px}
.wf-header{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--border);margin-bottom:16px}
.wf-header .wf-title{font-size:16px;font-weight:600}
.wf-badge{padding:2px 10px;border-radius:12px;font-size:11px}
.wf-badge.running{background:#DBEAFE;color:#1E40AF}
.wf-badge.done{background:#D1FAE5;color:#065F46}
.wf-progress{height:10px;background:#E8EDF2;border-radius:5px;overflow:hidden;margin:8px 0}
.wf-progress .wf-progress-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--primary),var(--secondary));transition:width .5s ease}
.wf-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.wf-stat{text-align:center;padding:10px;border-radius:8px;background:#F8FAFC}
.wf-stat .wf-stat-val{font-size:22px;font-weight:700}
.wf-stat .wf-stat-lbl{font-size:11px;color:var(--text3);margin-top:2px}
.wf-log{background:#1A2332;color:#E8EDF2;border-radius:8px;padding:10px 14px;font-family:'Courier New',monospace;font-size:11px;line-height:1.7;max-height:160px;overflow-y:auto;margin:12px 0}
.wf-log .l{opacity:0;animation:logIn .3s forwards}
.wf-log .l.info{color:#60A5FA}
.wf-log .l.ok{color:#34D399}
.wf-log .l.warn{color:#FBBF24}
.wf-log .l.err{color:#F87171}
.wf-patient-list{max-height:200px;overflow-y:auto;margin:12px 0}
.wf-patient-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px}
.wf-patient-row:last-child{border-bottom:none}
.wf-patient-row .wf-pname{width:60px;font-weight:500}
.wf-patient-row .wf-pstatus{flex:1;font-size:11px}
.wf-patient-row .wf-pbar{width:80px}
.wf-patient-row .wf-pbar .wf-pbar-track{height:6px;background:#E8EDF2;border-radius:3px;overflow:hidden}
.wf-patient-row .wf-pbar .wf-pbar-fill{height:100%;border-radius:3px;transition:width .5s}
/* Rule Editor */
.re-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.re-full{grid-column:1/-1}
.re-nodes{margin:12px 0}
.re-node{display:grid;grid-template-columns:1fr 60px 1fr 1fr;gap:8px;padding:8px;background:#F8FAFC;border-radius:6px;margin-bottom:6px;align-items:center}
.re-node input,.re-node select{padding:4px 8px;border:1px solid var(--border);border-radius:4px;font-size:12px;outline:none;background:#fff}
.re-node input:focus,.re-node select:focus{border-color:var(--primary)}
.wf-history-table{width:100%;border-collapse:collapse;font-size:13px}
.wf-history-table th{padding:8px 10px;background:var(--primary-bg);color:var(--primary);font-weight:600;text-align:left;font-size:12px;border-bottom:2px solid #CBD5E1}
.wf-history-table td{padding:8px 10px;border-bottom:1px solid var(--border)}
.wf-history-table tr:hover td{background:#F8FAFC}
.wf-tabs{display:flex;gap:2px;margin-bottom:12px;background:#F1F5F9;border-radius:8px;padding:3px}
.wf-tab{padding:6px 16px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--text2);transition:all .2s}
.wf-tab.active{background:var(--card);color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.wf-panel{display:none}
.wf-panel.active{display:block}

@media(max-width:768px){
  .mobile-toggle{display:flex}
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .content{padding:16px}
  .header{padding:12px 16px}
  .header h2{font-size:16px;margin-left:36px}
  .form-row{grid-template-columns:1fr}
}
</style>
</head>
<body>

<button class="mobile-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="logo"><i class="fas fa-robot"></i> AI 随访系统</div>
    <div class="sub">四川省骨科医院</div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-group">
      <div class="nav-label">概览</div>
      <div class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')"><i class="fas fa-chart-pie"></i> 总览大盘</div>
      <div class="nav-item" data-page="alertboard" onclick="navigate('alertboard')"><i class="fas fa-bell"></i> 预警看板 <span class="alert-dot red"></span></div>
    </div>
    <div class="nav-group">
      <div class="nav-label">核心功能</div>
      <div class="nav-item" data-page="followup" onclick="navigate('followup')"><i class="fas fa-brain"></i> AI 随访引擎</div>
      <div class="nav-item" data-page="doctor" onclick="navigate('doctor')"><i class="fas fa-user-md"></i> 随访虚拟医生</div>
      <div class="nav-item" data-page="patients" onclick="navigate('patients')"><i class="fas fa-users"></i> 患者管理</div>
      <div class="nav-item" data-page="rules" onclick="navigate('rules')"><i class="fas fa-list-check"></i> 随访规则库</div>
    </div>
    <div class="nav-group">
      <div class="nav-label">数据价值</div>
      <div class="nav-item" data-page="profile" onclick="navigate('profile')"><i class="fas fa-heartbeat"></i> 群体健康画像</div>
      <div class="nav-item" data-page="insights" onclick="navigate('insights')"><i class="fas fa-flask"></i> 科研数据舱</div>
      <div class="nav-item" data-page="revenue" onclick="navigate('revenue')"><i class="fas fa-chart-line"></i> 创收分析</div>
    </div>
    <div class="nav-group">
      <div class="nav-label">系统</div>
      <div class="nav-item" data-page="settings" onclick="navigate('settings')"><i class="fas fa-cog"></i> 系统配置</div>
    </div>
  </nav>
  <div class="sidebar-footer">v3.0 · 全自动随访闭环 · AI-Powered</div>
</aside>

<div class="main">
  <header class="header">
    <h2 id="pageTitle">总览大盘</h2>
    <div class="header-right">
      <span class="time" onclick="navigate('alertboard')" style="cursor:pointer"><i class="far fa-bell"></i> <span class="badge" id="alertBadge">3</span></span>
      <span class="time" id="headerTime"></span>
      <span style="color:var(--text2);font-size:13px"><i class="far fa-user-circle"></i> 骨科医师 · 系统管理员</span>
    </div>
  </header>
  <div class="content">
    <div class="page active" id="page-dashboard"></div>
    <div class="page" id="page-alertboard"></div>
    <div class="page" id="page-followup"></div>
    <div class="page" id="page-doctor"></div>
    <div class="page" id="page-patients"></div>
    <div class="page" id="page-rules"></div>
    <div class="page" id="page-profile"></div>
    <div class="page" id="page-insights"></div>
    <div class="page" id="page-revenue"></div>
    <div class="page" id="page-settings"></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<script>
/* ===================================================================
   DATA
   =================================================================== */
const SURGERIES = ['腰椎间盘突出术后','全膝关节置换术后','全髋关节置换术后','颈椎前路减压术后','脊柱侧弯矫形术后','半月板修复术后','肩袖损伤修复术后','骨折内固定术后'];
const SURGERY_RULES = {
  '腰椎间盘突出术后':[{name:'术后1周',day:7,channel:'电话',tasks:'疼痛评分、切口情况、神经功能'},{name:'术后1月',day:30,channel:'电话+微信',tasks:'功能恢复、用药依从性、康复指导'},{name:'术后3月',day:90,channel:'微信',tasks:'影像复查提醒、功能评估量表'},{name:'术后6月',day:180,channel:'微信+短信',tasks:'远期疗效评估、生活质量问卷'},{name:'术后12月',day:365,channel:'电话',tasks:'年度复查提醒、满意度调查'}],
  '全膝关节置换术后':[{name:'术后2周',day:14,channel:'电话',tasks:'切口愈合、疼痛管理、ROM评估'},{name:'术后1月',day:30,channel:'电话+微信',tasks:'康复训练指导、用药调整'},{name:'术后3月',day:90,channel:'微信',tasks:'功能评分(KSS)、影像复查'},{name:'术后6月',day:180,channel:'微信+短信',tasks:'中期功能评估、并发症筛查'},{name:'术后12月',day:365,channel:'电话',tasks:'年度随访、满意度调查、X线复查'}],
  '全髋关节置换术后':[{name:'术后2周',day:14,channel:'电话',tasks:'切口检查、体位指导、疼痛评估'},{name:'术后1月',day:30,channel:'电话+微信',tasks:'脱位预防教育、康复评估'},{name:'术后3月',day:90,channel:'微信',tasks:'Harris评分、影像复查'},{name:'术后6月',day:180,channel:'微信+短信',tasks:'功能评估、生活质量评价'},{name:'术后12月',day:365,channel:'电话',tasks:'年度随访、X线复查、满意度'}],
  '默认':[{name:'术后1周',day:7,channel:'电话',tasks:'基本情况评估'},{name:'术后1月',day:30,channel:'电话',tasks:'恢复评估'},{name:'术后3月',day:90,channel:'微信',tasks:'中期评估'},{name:'术后6月',day:180,channel:'微信+短信',tasks:'功能评估'},{name:'术后12月',day:365,channel:'电话',tasks:'年度随访'}]
};
const RISK_TAGS = [{name:'术后感染高风险',level:'high',count:0},{name:'深静脉血栓风险',level:'high',count:0},{name:'疼痛控制不佳',level:'high',count:0},{name:'切口愈合不良',level:'medium',count:0},{name:'康复依从性差',level:'medium',count:0},{name:'关节僵硬倾向',level:'medium',count:0},{name:'用药不规律',level:'medium',count:0},{name:'跌倒风险',level:'medium',count:0},{name:'营养不良',level:'low',count:0},{name:'焦虑/抑郁倾向',level:'low',count:0},{name:'低血压风险',level:'low',count:0},{name:'体重控制不佳',level:'low',count:0}];
const ALERTS_DATA = [
  {tier:'red',title:'疼痛评分异常升高',patient:'张伟',time:'10 分钟前',desc:'腰椎间盘突出术后患者 VAS 评分从 3→8，建议紧急干预'},
  {tier:'red',title:'切口感染高风险',patient:'李强',time:'32 分钟前',desc:'全膝关节置换术后切口红肿渗液，CRP 升高'},
  {tier:'orange',title:'失联超 7 天',patient:'赵敏',time:'1 小时前',desc:'AI 多通道触达失败，需启动人工干预流程'},
  {tier:'orange',title:'康复训练停滞',patient:'王芳',time:'2 小时前',desc:'术后功能评估连续 2 次无改善，建议调整方案'},
  {tier:'yellow',title:'用药依从性下降',patient:'刘洋',time:'4 小时前',desc:'抗凝药漏服 3 次，需加强用药提醒'},
  {tier:'yellow',title:'复查逾期 2 天',patient:'陈静',time:'6 小时前',desc:'术后 3 月影像复查未完成，已发送提醒'},
  {tier:'yellow',title:'满意度评分偏低',patient:'杨磊',time:'8 小时前',desc:'随访满意度 3/10，建议了解原因并改进'}
];
const CHAT_SCENARIOS = [
  {q:'我最近膝盖有点疼，正常吗？',a:'您好！术后出现一定程度的疼痛是正常的恢复过程，但需要关注疼痛程度。请问您的疼痛评分是几分（0-10分）？如果超过 5 分或持续加重，建议提前来院复查。' +
    '<br><br>同时建议您：<br>① 坚持遵医嘱进行康复训练<br>② 避免过度负重<br>③ 按时服用消炎镇痛药物'},
  {q:'什么时候可以下地走路？',a:'根据您的术式（全膝关节置换术后），标准康复流程如下：<br><br>• 术后第 1 天：在助行器辅助下站立<br>• 术后 1-2 周：室内短距离行走<br>• 术后 4-6 周：逐渐增加活动量<br>• 术后 3 个月：恢复正常行走<br><br>具体进度请以您的主治医师评估为准，建议拍摄行走视频上传至我科微信服务号便于评估。'},
  {q:'我的复查时间是多久？',a:'为您查询到随访计划如下：<br><br>📅 术后 2 周：切口检查、拆线<br>📅 术后 1 月：康复评估、用药调整<br>📅 术后 3 月：功能评分(KSS)、影像复查<br>📅 术后 6 月：中期功能评估<br>📅 术后 12 月：年度随访<br><br>系统会在每个节点前 3 天自动发送提醒，请保持电话畅通。'},
  {q:'我的药还需要吃多久？',a:'术后的药物方案通常包括：<br><br>💊 抗凝药物：一般使用 4-6 周（具体遵医嘱）<br>💊 消炎镇痛药：根据疼痛情况逐步减量<br>💊 钙剂+维生素D：建议长期补充<br><br>⚠️ 请不要自行停药，尤其是抗凝药物！我将在下次随访时提醒您的主管医师进行评估。'},
  {q:'康复训练要注意什么？',a:'术后康复训练要点：<br><br>✅ <strong>踝泵运动</strong>：每天 500-1000 次（预防血栓）<br>✅ <strong>股四头肌等长收缩</strong>：每天 3-4 组<br>✅ <strong>关节活动度训练</strong>：循序渐进，勿暴力<br><br>❌ 避免：<br>• 3 个月内避免跑跳<br>• 6 个月内避免重体力劳动<br>• 避免长时间同一姿势<br><br>推荐关注我科微信视频号，有专业康复师示范视频。'}
];

const PATIENTS = [];
const NAMES = ['张伟','王芳','李强','赵敏','刘洋','陈静','杨磊','周婷','吴刚','郑茜','孙鹏','钱红','黄凯','朱莉','何斌','林雪','马超','胡蝶','郭峰','唐雅'];
function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function pick(arr){return arr[rand(0,arr.length-1)]}
const TODAY = new Date(2026,4,5);

// Assign risk tags to patients
for(let i=1;i<=48;i++){
  const surgery = pick(SURGERIES);
  const daysSince = rand(5,400);
  const d = new Date(TODAY); d.setDate(d.getDate()-daysSince);
  const st = Math.random()<.25?'已完成':Math.random()<.3?'待执行':Math.random()<.15?'已失联':Math.random()<.2?'进行中':'已逾期';
  const patientRiskTags = [];
  const tagCount = rand(0,3);
  const shuffledTags = [...RISK_TAGS].sort(()=>Math.random()-.5);
  for(let t=0;t<tagCount;t++) {
    patientRiskTags.push(shuffledTags[t].name);
    const found = RISK_TAGS.find(rt=>rt.name===shuffledTags[t].name);
    if(found) found.count++;
  }
  PATIENTS.push({
    id:'SC'+(10000+i), name:pick(NAMES), age:rand(22,78), gender:Math.random()>.5?'男':'女',
    surgery, phone:'138'+rand(10000000,99999999),
    dischargeDate:d.toISOString().slice(0,10),
    doctor:pick(['王主任','李副主任','张主治','刘医师','陈医师']),
    status:st,
    nextFollowup:st==='已完成'?'-':new Date(TODAY.getTime()+rand(1,60)*86400000).toISOString().slice(0,10),
    channel:st==='已完成'?'-':pick(['短信','微信','电话','微信+短信','电话+微信']),
    reachRate:rand(30,95),
    riskTags:patientRiskTags
  });
}

// Alert counts for badge
let alertCount = ALERTS_DATA.length;
// Follow-up history
let followupHistory = [];
let wfTimer = null;

/* ===================================================================
   ROUTER
   =================================================================== */
const PAGE_TITLES = {
  dashboard:'总览大盘',alertboard:'预警看板',followup:'AI 随访引擎',doctor:'随访虚拟医生',
  patients:'患者管理',rules:'随访规则库',profile:'群体健康画像',
  insights:'科研数据舱',revenue:'创收分析',settings:'系统配置'
};
let currentPage = 'dashboard';

function navigate(page){
  currentPage = page;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const item = document.querySelector(`.nav-item[data-page="${page}"]`);
  if(item) item.classList.add('active');
  document.getElementById('pageTitle').textContent = PAGE_TITLES[page];
  window.scrollTo(0,0);
  renderPage(page);
  if(window.innerWidth<=768) document.getElementById('sidebar').classList.remove('open');
}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}

function renderPage(page){
  const fns = {
    dashboard:renderDashboard, alertboard:renderAlertBoard, followup:renderFollowUp,
    doctor:renderDoctor, patients:renderPatients, rules:renderRules,
    profile:renderProfile, insights:renderInsights, revenue:renderRevenue, settings:renderSettings
  };
  if(fns[page]) fns[page]();
}

/* ===================================================================
   DASHBOARD
   =================================================================== */
let dashCharts = {};

function renderDashboard(){
  const el = document.getElementById('page-dashboard');
  const total = PATIENTS.length;
  const completed = PATIENTS.filter(p=>p.status==='已完成').length;
  const lost = PATIENTS.filter(p=>p.status==='已失联').length;
  const pending = PATIENTS.filter(p=>p.status==='待执行'||p.status==='进行中').length;
  const overdue = PATIENTS.filter(p=>p.status==='已逾期').length;
  const avgRate = Math.round(PATIENTS.reduce((s,p)=>s+p.reachRate,0)/total);

  el.innerHTML = `
    <div class="row row-4 mb-16">
      <div class="stat-card">
        <div class="stat-icon" style="background:#DBEAFE;color:var(--primary)"><i class="fas fa-hospital-user"></i></div>
        <div class="stat-label">出院患者总数</div>
        <div class="stat-value">${total}</div>
        <div class="stat-change" style="color:var(--text3)">本月新增 ${rand(8,15)} 人</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#D1FAE5;color:var(--green)"><i class="fas fa-check-circle"></i></div>
        <div class="stat-label">随访完成</div>
        <div class="stat-value">${completed}</div>
        <div class="stat-change" style="color:var(--green)"><i class="fas fa-arrow-up"></i> 覆盖率 ${Math.round(completed/total*100)}%</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#FEE2E2;color:var(--red)"><i class="fas fa-exclamation-triangle"></i></div>
        <div class="stat-label">预警事件</div>
        <div class="stat-value">${alertCount}</div>
        <div class="stat-change" style="color:var(--red)"><i class="fas fa-circle"></i> 红色 ${ALERTS_DATA.filter(a=>a.tier==='red').length} · 橙色 ${ALERTS_DATA.filter(a=>a.tier==='orange').length} · 黄色 ${ALERTS_DATA.filter(a=>a.tier==='yellow').length}</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#EDE9FE;color:var(--purple)"><i class="fas fa-phone-volume"></i></div>
        <div class="stat-label">综合触达率</div>
        <div class="stat-value">${avgRate}%</div>
        <div class="stat-change" style="color:var(--green)"><i class="fas fa-arrow-up"></i> 较上月 +${rand(3,8)}%</div>
      </div>
    </div>

    <div class="row row-2">
      <div class="card">
        <div class="card-header"><h3><i class="fas fa-exchange-alt" style="color:var(--primary)"></i> 升级前后对比</h3><span class="tag">效果验证</span></div>
        <div class="comparison-grid">

function sendQuickMsg(idx){
  if(idx>=0&&idx<CHAT_SCENARIOS.length){
    addChatMsg(CHAT_SCENARIOS[idx].q,'user');
    setTimeout(()=>addChatMsg(CHAT_SCENARIOS[idx].a,'bot'),500+rand(200,600));
  }
}

function sendChatMsg(){
  const input = document.getElementById('chatInput');
  if(!input||!input.value.trim()) return;
  const text = input.value.trim();
  input.value = '';
  addChatMsg(text,'user');
  // Auto-reply with closest match
  const matched = CHAT_SCENARIOS.find(s=>text.includes(s.q.slice(0,4))||s.q.includes(text.slice(0,6))) || CHAT_SCENARIOS[rand(0,CHAT_SCENARIOS.length-1)];
  setTimeout(()=>addChatMsg(matched.a,'bot'),500+rand(200,600));
}

function addChatMsg(text,role){
  const container = document.getElementById('chatMessages');
  if(!container) return;
  const div = document.createElement('div');
  div.className = 'chat-msg '+role;
  div.innerHTML = text + `<span class="msg-time">${new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}</span>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  chatHistory.push({role,text});
}

            <th>随访状态</th><th>风险标签</th><th>触达率</th><th>操作</th>

            ${filtered.map(p=>`

function togglePatient(id){
  if(selectedPatients.has(id)) selectedPatients.delete(id);
  else selectedPatients.add(id);
  renderPatients();
}
function toggleSelectAll(checked){
  const filtered = PATIENTS.filter(p=>{
    if(patientFilter && !p.name.includes(patientFilter) && !p.id.includes(patientFilter)) return false;
    if(patientSurgery && p.surgery!==patientSurgery) return false;
    return true;
  });
  if(checked) filtered.forEach(p=>selectedPatients.add(p.id));
  else filtered.forEach(p=>selectedPatients.delete(p.id));
  renderPatients();
}
function batchFollowup(){
  if(selectedPatients.size===0){alert('请先选择患者');return}
  const selected = PATIENTS.filter(p=>selectedPatients.has(p.id));
  const m = document.getElementById('modalContent');
  const overlay = document.getElementById('modalOverlay');
  const now = new Date();
  const batchId = 'FUP-'+now.getFullYear()+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0')+'-'+String(followupHistory.length+1).padStart(3,'0');

  m.className = 'modal modal-wide';
  m.innerHTML = `
    <div class="wf-header">
      <span class="wf-badge running" id="wfBadge">⏳ 运行中</span>
      <span class="wf-title">${batchId} · 批量自动随访</span>
      <span style="margin-left:auto;font-size:12px;color:var(--text2)" id="wfPatients">${selected.length} 位患者</span>
      <button class="btn btn-outline btn-sm" onclick="closeModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="wf-progress"><div class="wf-progress-fill" id="wfProgress" style="width:0%"></div></div>
    <div class="wf-stats" id="wfStats">
      <div class="wf-stat"><div class="wf-stat-val" style="color:var(--green)" id="wfDone">0</div><div class="wf-stat-lbl">✅ 完成</div></div>
      <div class="wf-stat"><div class="wf-stat-val" style="color:var(--blue)" id="wfDoing">0</div><div class="wf-stat-lbl">⏳ 处理中</div></div>
      <div class="wf-stat"><div class="wf-stat-val" style="color:var(--red)" id="wfFail">0</div><div class="wf-stat-lbl">❌ 失败</div></div>
      <div class="wf-stat"><div class="wf-stat-val" style="color:var(--text2)" id="wfWait">${selected.length}</div><div class="wf-stat-lbl">⏸ 待处理</div></div>
    </div>
    <div class="wf-tabs">
      <button class="wf-tab active" onclick="switchWfTab(this,'log')"><i class="fas fa-terminal"></i> 实时日志</button>
      <button class="wf-tab" onclick="switchWfTab(this,'list')"><i class="fas fa-list"></i> 患者状态</button>
      <button class="wf-tab" onclick="switchWfTab(this,'result')"><i class="fas fa-chart-bar"></i> 执行结果</button>
    </div>
    <div class="wf-panel active" id="wfLogPanel">
      <div class="wf-log" id="wfLog"><div class="l info" style="opacity:1">[${now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}] 批量随访任务启动 — 准备处理 ${selected.length} 位患者...</div></div>
    </div>
    <div class="wf-panel" id="wfListPanel">
      <div class="wf-patient-list" id="wfPatientList"></div>
    </div>
    <div class="wf-panel" id="wfResultPanel">
      <div style="text-align:center;padding:30px 0" id="wfResultContent"><span class="text-muted">任务执行中，请查看日志面板...</span></div>
    </div>
  `;
  overlay.classList.add('show');

  // Initialize patient list
  const listEl = document.getElementById('wfPatientList');
  const patientStates = selected.map(p=>({
    id:p.id, name:p.name, surgery:p.surgery,
    channels:['短信','微信','电话'].filter(()=>Math.random()>.3),
    status:'pending', progress:0
  }));
  patientStates.forEach(ps => {
    const row = document.createElement('div');
    row.className = 'wf-patient-row';
    row.id = 'wfpr-'+ps.id;
    row.innerHTML = `<span class="wf-pname">${ps.name}</span><span class="wf-pstatus" id="wfps-${ps.id}">⏸ 等待中</span><div class="wf-pbar"><div class="wf-pbar-track"><div class="wf-pbar-fill" id="wpf-${ps.id}" style="width:0%;background:var(--text3)"></div></div></div>`;
    listEl.appendChild(row);
  });

  // Simulate workflow
  let done = 0, doing = 0, fail = 0, wait = selected.length;
  let logIdx = 0;
  const logLines = [
    (p)=>`[通道引擎] ${p.name} → SMS 通道预检: 号码有效, 签名已配置 ✓`,
    (p)=>`[短信通道] → ${p.name} 术后康复指导 #001 已发送 (送达率 94%)`,
    (p)=>`[微信通道] → ${p.name} 服务号推送功能评估量表 (已读 ${rand(60,90)}%)`,
    (p)=>`[AI语音] 外呼 ${p.name} 138****${rand(1000,9999)} — ${Math.random()>.2?'已接通':'未接通, 转短信留言'}`,
    (p)=>`[NLP] ${p.name} 对话完成 → 采集到 疼痛评分/ROM/用药依从性 3项`,
    (p)=>`[预警引擎] ${p.name} 数据评估: 无异常 ✓`
  ];

  function addWfLog(text, cls='info'){
    const log = document.getElementById('wfLog');
    if(!log) return;
    const d = document.createElement('div'); d.className = 'l '+cls;
    d.textContent = '['+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+'] '+text;
    log.appendChild(d); log.scrollTop = log.scrollHeight;
  }

  function processNext(){
    const pending = patientStates.filter(ps=>ps.status==='pending');
    if(pending.length===0 && doing===0){
      // All done
      const totalDone = patientStates.filter(ps=>ps.status==='done').length;
      const totalFail = patientStates.filter(ps=>ps.status==='fail').length;
      addWfLog(`✅ 批量随访完成！成功 ${totalDone} 人, 失败 ${totalFail} 人`, 'ok');
      document.getElementById('wfBadge').className = 'wf-badge done';
      document.getElementById('wfBadge').textContent = '✅ 已完成';
      // Show results
      document.getElementById('wfResultContent').innerHTML = `
        <div style="font-size:28px;font-weight:700;color:var(--green);margin-bottom:8px">✅ ${totalDone}/${patientStates.length}</div>
        <div class="text-muted">随访任务已完成</div>
        <div style="margin:16px auto;max-width:300px">
          <div class="compare-bar"><span>成功率</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(totalDone/patientStates.length*100)}%;background:var(--green)"></div></div><span>${Math.round(totalDone/patientStates.length*100)}%</span></div>
          <div class="compare-bar"><span>预警触发</span><div class="bar-track"><div class="bar-fill" style="width:${rand(5,15)}%;background:var(--orange)"></div></div><span>${rand(1,4)}件</span></div>
          <div class="compare-bar"><span>数据采集</span><div class="bar-track"><div class="bar-fill" style="width:100%;background:var(--purple)"></div></div><span>${totalDone*3}项</span></div>
        </div>
        <button class="btn btn-outline btn-sm mt-16" onclick="showFollowupHistory()"><i class="fas fa-history"></i> 查看历史记录</button>
      `;
      // Save to history
      followupHistory.push({
        id:batchId, time:now.toLocaleString('zh-CN'), total:patientStates.length,
        done:totalDone, fail:totalFail, mode:'AI批量', patients:patientStates
      });
      // Clear selection
      selectedPatients.clear(); renderPatients();
      return;
    }
    // Process next batch (up to 3 concurrent)
    const toProcess = pending.slice(0, Math.min(3, pending.length));
    toProcess.forEach(ps => {
      ps.status = 'doing'; doing++; wait--;
      updateStats();
      const p = selected.find(x=>x.id===ps.id);
      addWfLog(`[开始] ${ps.name} — 启动多渠道触达`, 'info');
      // Simulate each channel
      let channelIdx = 0;
      function nextChannel(){
        if(channelIdx < logLines.length){
          addWfLog(logLines[channelIdx](ps), channelIdx===3&&Math.random()>.2?'ok':channelIdx===3?'warn':'ok');
          const pct = Math.round(((channelIdx+1)/logLines.length)*100);
          ps.progress = pct;
          const bar = document.getElementById('wpf-'+ps.id);
          if(bar){bar.style.width=pct+'%';bar.style.background=pct<50?'var(--yellow)':pct<100?'var(--blue)':'var(--green)';}
          const statusEl = document.getElementById('wfps-'+ps.id);
          if(statusEl) statusEl.textContent = pct<100?`📡 ${['短信准备','短信发送','微信推送','语音呼叫','NLP分析'][channelIdx]||'处理中'}`:'✅ 完成';
          channelIdx++;
          setTimeout(nextChannel, rand(300,800));
        } else {
          ps.status = Math.random()>.1?'done':'fail';
          doing--;
          if(ps.status==='done') done++; else fail++;
          updateStats();
          const bar = document.getElementById('wpf-'+ps.id);
          if(bar){bar.style.width='100%';bar.style.background=ps.status==='done'?'var(--green)':'var(--red)';}
          const statusEl = document.getElementById('wfps-'+ps.id);
          if(statusEl) statusEl.textContent = ps.status==='done'?'✅ 完成':'❌ 失败';
          addWfLog(ps.status==='done'?`✅ ${ps.name} 随访完成 → 数据已归档`:`❌ ${ps.name} 随访失败 → 已标记重试`, ps.status==='done'?'ok':'err');
          // Update progress
          const total = patientStates.length;
          const processed = done+fail;
          const pct = Math.round((processed/total)*100);
          const prog = document.getElementById('wfProgress');
          if(prog) prog.style.width = pct+'%';
          setTimeout(processNext, 200);
        }
      }
      setTimeout(nextChannel, rand(200,500));
    });
  }

  function updateStats(){
    document.getElementById('wfDone').textContent = done;
    document.getElementById('wfDoing').textContent = doing;
    document.getElementById('wfFail').textContent = fail;
    document.getElementById('wfWait').textContent = wait;
  }

  processNext();
}

function switchWfTab(btn, panel){
  document.querySelectorAll('.wf-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.wf-panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('wf'+panel.charAt(0).toUpperCase()+panel.slice(1)+'Panel').classList.add('active');
}

  const el = document.getElementById('page-rules');
  el.innerHTML = `
    <div class="row row-2">
      <div class="card">
        <div class="card-header"><h3><i class="fas fa-microphone" style="color:var(--primary)"></i> 口述生成规则</h3><span class="tag">AI 语音转规则</span></div>

function toggleVoice(){
  const btn = document.getElementById('voiceBtn');
  const icon = document.getElementById('voiceIcon');
  const status = document.getElementById('voiceStatus');
  const textarea = document.getElementById('voiceText');
  if(btn.classList.toggle('recording')){
    icon.className='fas fa-stop'; status.textContent='🎙️ 录音中... 请口述随访规则';
    setTimeout(()=>{
      btn.classList.remove('recording'); icon.className='fas fa-microphone';
      status.textContent='✅ 录音完成';
      textarea.value='腰椎间盘突出术后第1周需要电话随访，评估疼痛评分、切口情况、神经功能；第1个月电话+微信随访，评估功能恢复、用药依从性、康复指导；第3个月微信随访，提醒影像复查...';

    icon.className='fas fa-microphone'; status.textContent='点击开始口述';

function addRuleNode(){
  const container = document.getElementById('reNodes');
  const idx = container.children.length;

  div.innerHTML = `<input placeholder="节点名称" class="re-node-name"><input placeholder="天数" type="number" class="re-node-day"><select class="re-node-ch"><option>电话</option><option>微信</option><option>短信</option><option selected>电话+微信</option><option>微信+短信</option></select><input placeholder="任务内容" class="re-node-tasks">`;

function saveRuleDraft(){
  const name = document.getElementById('reName')?.value || '未命名规则';
  alert(`📝 规则「${name}」已保存为草稿\n\n可在规则库中继续编辑`);
  closeModal();
}
function confirmRule(){
  const name = document.getElementById('reName')?.value || '未命名规则';
  const status = document.getElementById('reStatus')?.value === '1' ? '已启用' : '已停用';
  const start = document.getElementById('reStart')?.value || '-';
  const end = document.getElementById('reEnd')?.value || '-';
  const surgery = document.getElementById('reSurgery')?.value || '未指定';
  const nodes = document.querySelectorAll('.re-node');
  let nodeSummary = '';
  nodes.forEach((n,i)=>{
    const inputs = n.querySelectorAll('input,select');
    if(inputs.length>=4 && inputs[0].value){
      nodeSummary += `\n  ${i+1}. ${inputs[0].value} (术后${inputs[1].value||'?'}天 · ${inputs[2].value})`;
    }
  });
  alert(`✅ 规则已确定生效\n\n规则名称：${name}\n适用术式：${surgery}\n状态：${status}\n适用期：${start} 至 ${end}\n\n随访节点：${nodeSummary}\n\n短信模板 ✓  语音话术 ✓`);
  closeModal();
}
function handleGuideGenerate(){
  const guideCount = parseInt(document.getElementById('guideCount').textContent);
  if(guideCount === 0){

}

      <div class="stat-card"><div class="stat-icon" style="background:#EDE9FE;color:var(--purple)"><i class="fas fa-chart-pie"></i></div><div class="stat-label">预估月增量收入</div><div class="stat-value">¥${rand(5,10)}万</div><div class="stat-change" style="color:var(--green)"><i class="fas fa-arrow-up"></i> 年化预估 ${rand(60,120)}万</div></div>
    </div>
    <div class="row row-2">
      <div class="card"><div class="card-header"><h3><i class="fas fa-chart-area" style="color:var(--secondary)"></i> AI 随访创收趋势</h3></div><div style="height:250px"><canvas id="revenueChart"></canvas></div></div>

        <div style="padding:8px 0">
          <div class="comp-item"><span class="label">系统建设成本</span><span class="value">¥${rand(8,15)}万/年</span></div>
          <div class="comp-item"><span class="label">人力成本节省</span><span class="value" style="color:var(--green)">-¥${rand(12,20)}万/年</span></div>
          <div class="comp-item"><span class="label">增创收入</span><span class="value" style="color:var(--green)">+¥${rand(60,120)}万/年</span></div>
          <div class="comp-item" style="border-top:2px solid var(--border);margin-top:8px;padding-top:12px"><span class="label" style="font-weight:600">净收益</span><span class="value" style="color:var(--green);font-size:20px">¥${rand(60,110)}万/年</span></div>
          <div class="comp-item"><span class="label">投资回报周期</span><span class="value" style="color:var(--green)">< ${rand(1,3)} 个月</span></div>
          <div class="comp-item"><span class="label">预警避免损失</span><span class="value" style="color:var(--green)">≈ ¥${rand(3,8)}万/年</span></div>
        </div>
      </div>
    </div>
  `;
  setTimeout(()=>{
    Object.values(revenueCharts).forEach(c=>c.destroy()); revenueCharts = {};
    const c = document.getElementById('revenueChart');
    if(c) revenueCharts.main = new Chart(c,{
      type:'bar',
      data:{labels:['1月','2月','3月','4月','5月','6月(预估)'],
        datasets:[{label:'AI 增创收入 (万元)',data:[2.1,3.5,5.2,6.8,7.5,9.2],backgroundColor:'rgba(16,185,129,.7)',borderRadius:4},{label:'传统随访收入 (万元)',data:[12,11.5,10.8,10.2,9.5,9],backgroundColor:'rgba(136,153,170,.4)',borderRadius:4}]},
      options:{plugins:{legend:{position:'top',labels:{usePointStyle:true}}},scales:{y:{beginAtZero:true,title:{display:true,text:'收入 (万元)'}}}}
    });
  },50);
}

function updateClock(){

    now.toLocaleDateString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'})+' '+
    now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
}

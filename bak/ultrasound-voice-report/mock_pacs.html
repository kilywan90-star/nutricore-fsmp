<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>医院网页版 B/S PACS 报告系统模拟端</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 30px; background: #f4f6f9; }
        .container { max-width: 600px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        h2 { color: #333; border-bottom: 2px solid #007bff; padding-bottom: 8px; }
        .info-bar { background: #e9ecef; padding: 10px; border-radius: 4px; margin-bottom: 20px; font-weight: bold; color: #495057; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #6c757d; font-weight: bold;}
        input, textarea { width: 100%; padding: 8px; border: 1px solid #ced4da; border-radius: 4px; box-sizing: border-box; transition: background-color 0.5s ease; }
    </style>
</head>
<body>
    <div class="container">
        <h2>超声科检查报告单</h2>
        <div class="info-bar">
            当前检查项目：<span id="exam_item">彩超检查(乳腺及附属淋巴结)</span>
        </div>

        <div class="form-group">
            <label>左乳结节所见</label>
            <input type="text" id="input_left_breast_nodule" value="">
        </div>
        <div class="form-group">
            <label>右乳结节所见</label>
            <input type="text" id="input_right_breast_nodule" value="">
        </div>
        <div class="form-group">
            <label>BI-RADS分级结论</label>
            <input type="text" id="input_bi_rads_grade" value="">
        </div>

        <hr style="border: 0; border-top: 1px dashed #ccc; margin: 20px 0;">
        <div class="info-bar" style="background: #e2f0d9;">
            腹部备用字段 (若切换为肝胆项目)
        </div>
        <div class="form-group">
            <label>肝脏大小</label>
            <input type="text" id="input_liver_size" value="">
        </div>
        <div class="form-group">
            <label>肝脏回声</label>
            <input type="text" id="input_liver_echo" value="">
        </div>
        <div class="form-group">
            <label>胆囊壁情况</label>
            <input type="text" id="input_gallbladder_wall" value="">
        </div>

        <div class="form-group">
            <label>其他异常发现 / 备注</label>
            <textarea id="input_other_findings" rows="3"></textarea>
        </div>
    </div>
</body>
</html>
